<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EFTracker Quest Board</title>
  <meta name="description" content="Escape from Tarkov quest tracker with Kappa filtering and official catalog sync.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050905;
      --bg-soft: #0a130a;
      --panel: #101b10;
      --panel-2: #0b140b;
      --line: #3d5a3d;
      --line-bright: #557755;
      --text: #d6ecd0;
      --muted: #8ea08a;
      --accent: #9fd08f;
      --accent-2: #ccf8bc;
      --warn: #d6be8f;
      --danger: #d48b7b;
      --ok: #9ccf88;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
      --radius: 9px;
      --font-head: "VT323", "Courier New", monospace;
      --font-body: "IBM Plex Mono", "Consolas", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(120% 90% at 8% -10%, rgba(132, 178, 108, 0.18), transparent 55%),
        radial-gradient(120% 130% at 100% 120%, rgba(96, 126, 78, 0.15), transparent 54%),
        linear-gradient(170deg, #040704, #060b06 45%, #050905);
      color: var(--text);
      font-family: var(--font-body);
      letter-spacing: 0.01em;
    }

    body {
      padding: 12px;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background:
        radial-gradient(circle, rgba(0, 0, 0, 0) 56%, rgba(0, 0, 0, 0.72) 100%),
        linear-gradient(rgba(15, 20, 15, 0) 50%, rgba(0, 0, 0, 0.34) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.07), rgba(0, 255, 0, 0.03), rgba(0, 0, 255, 0.07));
      background-size: 100% 100%, 100% 2px, 3px 100%;
      opacity: 0.9;
    }

    .crt-flicker {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.012);
      opacity: 0;
      animation: flicker 0.36s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.006; }
      50% { opacity: 0.017; }
      100% { opacity: 0.006; }
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(1520px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .frame {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(28, 43, 28, 0.85);
      position: relative;
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(170, 214, 157, 0.06), transparent 42%);
    }

    .bevel {
      border: 1px solid #243824;
      box-shadow:
        inset 1px 1px 0 rgba(168, 212, 152, 0.14),
        inset -1px -1px 0 rgba(6, 10, 6, 0.75);
      border-radius: 7px;
    }

    .mast {
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
      gap: 10px;
      align-items: center;
    }

    .mast-copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.61rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
    }

    .title {
      margin: 0;
      color: #b7ccb1;
      font: 500 clamp(1.25rem, 2.1vw, 1.7rem)/1 var(--font-head);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .top-nav {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #bdd1b7;
      background: linear-gradient(180deg, #1a291a, #142114);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      box-shadow: inset 1px 1px 0 rgba(170, 210, 154, 0.14), inset -1px -1px 0 rgba(6, 10, 6, 0.75);
    }

    .nav-btn[aria-current="page"],
    .nav-btn:hover {
      color: var(--accent-2);
      border-color: var(--line-bright);
      background: linear-gradient(180deg, #203420, #162816);
    }

    .clock-card {
      padding: 8px;
      display: grid;
      gap: 4px;
      background: rgba(10, 17, 10, 0.88);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .clock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #9db098;
      border-bottom: 1px dotted rgba(83, 113, 83, 0.45);
      padding-bottom: 3px;
    }

    .clock-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .clock-row strong {
      color: var(--accent-2);
      font-weight: 600;
      text-align: right;
      max-width: 70%;
      line-height: 1.2;
    }

    .controls {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) minmax(200px, 240px) auto auto auto auto auto;
      gap: 6px;
      align-items: center;
    }

    .status-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
    }

    .search,
    .select,
    .btn,
    .toggle {
      font: 500 0.72rem/1.2 var(--font-body);
      letter-spacing: 0.04em;
    }

    .search,
    .select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      color: var(--text);
      background: rgba(10, 16, 10, 0.92);
      box-shadow: inset 1px 1px 0 rgba(154, 197, 140, 0.14), inset -1px -1px 0 rgba(4, 7, 4, 0.7);
    }

    .search::placeholder {
      color: #748673;
    }

    .btn,
    .toggle {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c9dbc4;
      background: linear-gradient(180deg, #1b2b1b, #142314);
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(174, 220, 159, 0.17), inset -1px -1px 0 rgba(4, 8, 4, 0.75);
      white-space: nowrap;
    }

    .btn:hover,
    .toggle:hover {
      border-color: var(--line-bright);
      color: var(--accent-2);
    }

    .toggle[data-on="true"] {
      border-color: #6a9163;
      color: #d6f0cd;
      background: linear-gradient(180deg, #264225, #1b331b);
    }

    .btn.warn {
      border-color: #7b6e4f;
      color: #e1cea7;
      background: linear-gradient(180deg, #312818, #241c12);
    }

    .btn:disabled,
    .toggle:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      color: #8c9d89;
      border-color: #334633;
    }

    .catalog-box,
    .kappa-pill {
      padding: 7px 9px;
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(10, 16, 10, 0.8);
      color: #b0bea8;
      white-space: nowrap;
    }

    .catalog-box strong,
    .kappa-pill strong {
      color: var(--accent-2);
    }

    .catalog-box[data-state="error"] strong {
      color: #e1b0a4;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
      gap: 10px;
      min-height: 74vh;
    }

    .board,
    .detail {
      padding: 10px;
      max-height: calc(100vh - 214px);
      overflow: auto;
      scrollbar-width: thin;
      display: grid;
      gap: 9px;
      align-content: start;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .stat {
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(10, 16, 10, 0.85);
      box-shadow: inset 1px 1px 0 rgba(169, 212, 154, 0.13), inset -1px -1px 0 rgba(4, 8, 4, 0.72);
      min-height: 64px;
      display: grid;
      gap: 2px;
    }

    .stat .label {
      margin: 0;
      color: #8d9d8a;
      font-size: 0.53rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat .value {
      margin: 0;
      color: var(--accent-2);
      font: 500 1.22rem/1 var(--font-head);
      letter-spacing: 0.02em;
    }

    .stat .sub {
      margin: 0;
      color: #95a693;
      font-size: 0.58rem;
    }

    .group-stack {
      display: grid;
      gap: 8px;
    }

    .group {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(9, 14, 9, 0.85);
    }

    .group-head {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(80, 110, 80, 0.55);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, rgba(28, 43, 28, 0.78), rgba(17, 28, 17, 0.82));
    }

    .group-head h3 {
      margin: 0;
      color: #c6ddbf;
      font: 500 0.83rem/1 var(--font-head);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .group-head span {
      color: #a7b5a2;
      font-size: 0.56rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid var(--line-bright);
      border-radius: 999px;
      padding: 2px 6px;
      background: rgba(16, 25, 16, 0.8);
    }

    .table-head {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 120px;
      gap: 8px;
      align-items: center;
      padding: 5px 8px;
      border-bottom: 1px solid rgba(70, 95, 70, 0.48);
      font-size: 0.54rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8d9f89;
      background: rgba(12, 19, 12, 0.84);
    }

    .mission-list {
      display: grid;
    }

    .mission {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 120px;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-top: 1px solid rgba(55, 77, 55, 0.45);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .mission:first-child {
      border-top: none;
    }

    .mission:hover {
      background: rgba(42, 63, 42, 0.25);
    }

    .mission.active {
      background: rgba(59, 84, 59, 0.28);
      box-shadow: inset 2px 0 0 rgba(166, 209, 150, 0.95);
    }

    .mission.completed {
      opacity: 0.78;
    }

    .done-btn {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid #466046;
      background: #121c12;
      color: #8ea48a;
      display: grid;
      place-items: center;
      font-size: 0.74rem;
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(160, 200, 148, 0.15), inset -1px -1px 0 rgba(4, 8, 4, 0.7);
    }

    .done-btn[data-done="true"] {
      border-color: #6b9363;
      color: #daf2d1;
      background: #1f331f;
    }

    .mission-main {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .mission-title {
      margin: 0;
      color: #d6e6d1;
      font-size: 0.68rem;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mission-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      border: 1px solid rgba(81, 108, 81, 0.75);
      border-radius: 999px;
      padding: 1px 6px;
      font-size: 0.52rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a8b9a3;
      background: rgba(12, 19, 12, 0.84);
    }

    .tag.kappa {
      border-color: #6f9965;
      color: #d7f0cf;
      background: rgba(34, 57, 34, 0.85);
    }

    .mission-progress {
      display: grid;
      gap: 3px;
      justify-items: end;
    }

    .mission-progress .label {
      margin: 0;
      font-size: 0.54rem;
      color: #8ea08a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .bar {
      width: 100%;
      max-width: 115px;
      height: 7px;
      border: 1px solid rgba(77, 101, 77, 0.75);
      border-radius: 999px;
      background: #0a100a;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #6f9962, #b6e3a7);
      transition: width 0.2s ease;
    }

    .empty {
      padding: 16px;
      border: 1px dashed rgba(77, 104, 77, 0.82);
      border-radius: 6px;
      background: rgba(10, 16, 10, 0.82);
      text-align: center;
      color: #94a492;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .detail h2 {
      margin: 0;
      color: #cee7c6;
      font: 500 0.95rem/1.25 var(--font-head);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .sub {
      margin: 0;
      color: #8ea08a;
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .desc {
      margin: 0;
      color: #b5c6b2;
      font-size: 0.65rem;
      line-height: 1.55;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .wiki {
      width: fit-content;
      color: #b3cfe4;
      text-decoration: none;
      border-bottom: 1px dotted rgba(179, 207, 228, 0.45);
      font-size: 0.57rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .wiki:hover {
      color: #d0e4f3;
      border-bottom-color: rgba(208, 228, 243, 0.75);
    }

    .label-title {
      margin: 0;
      color: #8ea08a;
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .objective-list,
    .activity-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 5px;
    }

    .objective {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(11, 17, 11, 0.84);
      padding: 6px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.63rem;
      color: #c0d0bc;
      line-height: 1.4;
    }

    .objective input {
      margin-top: 1px;
      accent-color: #87b37a;
    }

    .objective.done {
      border-color: #688f60;
      color: #99ab95;
      text-decoration: line-through;
    }

    .activity {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(10, 16, 10, 0.82);
      padding: 6px;
      font-size: 0.58rem;
      color: #afbeaa;
      display: grid;
      gap: 2px;
      line-height: 1.35;
    }

    .activity time {
      font-size: 0.53rem;
      color: #8ea08a;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(110%);
      bottom: 12px;
      z-index: 10002;
      border: 1px solid var(--line-bright);
      border-radius: 999px;
      background: rgba(12, 19, 12, 0.95);
      color: var(--accent-2);
      padding: 8px 12px;
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: transform 0.2s ease;
      pointer-events: none;
      box-shadow: var(--shadow);
      max-width: min(90vw, 760px);
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1260px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .board,
      .detail {
        max-height: none;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1040px) {
      body {
        padding: 8px;
      }

      .mast {
        grid-template-columns: 1fr;
      }

      .control-grid,
      .status-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .table-head,
      .mission {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .mission-progress {
        grid-column: 1 / -1;
        justify-items: start;
      }

      .bar {
        max-width: none;
      }
    }

    /* Readability Hotfix */
    :root {
      --bg: #0d1118;
      --bg-soft: #131924;
      --panel: #161d28;
      --panel-2: #111722;
      --line: #2f3a4a;
      --line-bright: #49586d;
      --text: #e6ebf2;
      --muted: #a5afbf;
      --accent: #d4b87e;
      --accent-2: #f0d7a2;
      --warn: #d3aa6b;
      --danger: #d4978c;
      --ok: #95b7a7;
      --font-head: "Chakra Petch", "Eurostile", sans-serif;
      --font-body: "IBM Plex Mono", "Consolas", monospace;
    }

    html,
    body {
      background:
        radial-gradient(130% 110% at 8% -20%, rgba(212, 184, 126, 0.2), transparent 58%),
        radial-gradient(120% 120% at 100% 120%, rgba(110, 132, 168, 0.14), transparent 54%),
        linear-gradient(170deg, #0b1018, #0f1520 50%, #0c1119) !important;
      color: var(--text) !important;
    }

    body::before {
      display: none !important;
    }

    .crt-overlay {
      background:
        radial-gradient(circle, rgba(0, 0, 0, 0) 62%, rgba(0, 0, 0, 0.42) 100%),
        linear-gradient(rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0.22) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.012), rgba(0, 0, 255, 0.03)) !important;
      background-size: 100% 100%, 100% 2px, 3px 100% !important;
      opacity: 0.38 !important;
    }

    .crt-flicker {
      background: rgba(255, 255, 255, 0.01) !important;
      animation: flickerReadable 2.4s infinite !important;
    }

    @keyframes flickerReadable {
      0% { opacity: 0.004; }
      50% { opacity: 0.013; }
      100% { opacity: 0.004; }
    }

    .frame {
      background: linear-gradient(180deg, var(--panel), var(--panel-2)) !important;
      border-color: var(--line) !important;
    }

    .frame::before {
      background: linear-gradient(180deg, rgba(240, 215, 162, 0.04), transparent 46%) !important;
    }

    .kicker,
    .sub,
    .mission-progress .label,
    .catalog-box,
    .kappa-pill,
    .activity,
    .activity time {
      color: var(--muted) !important;
    }

    .title,
    .clock-row strong,
    .kappa-pill strong,
    .catalog-box strong,
    .stat .value {
      color: var(--accent-2) !important;
    }

    .nav-btn,
    .btn,
    .toggle,
    .search,
    .select {
      border-color: var(--line) !important;
      color: var(--text) !important;
      background: linear-gradient(180deg, #1b2432, #141b27) !important;
    }

    .nav-btn:hover,
    .btn:hover,
    .toggle:hover,
    .nav-btn[aria-current="page"] {
      border-color: var(--line-bright) !important;
      color: var(--accent-2) !important;
      background: linear-gradient(180deg, #242f42, #182234) !important;
    }

    .toggle[data-on="true"] {
      border-color: #b49661 !important;
      color: var(--accent-2) !important;
      background: linear-gradient(180deg, #3a3121, #2a2318) !important;
    }

    .btn.warn {
      border-color: #7e6343 !important;
      color: #e3c491 !important;
      background: linear-gradient(180deg, #322719, #241c12) !important;
    }

    .tag {
      border-color: #45566b !important;
      color: #c7d2e2 !important;
      background: rgba(18, 25, 36, 0.9) !important;
    }

    .tag.kappa {
      border-color: #b49661 !important;
      color: var(--accent-2) !important;
      background: rgba(55, 46, 30, 0.86) !important;
    }

    .done-btn {
      border-color: #55657a !important;
      background: #121923 !important;
      color: #b7c2d4 !important;
    }

    .done-btn[data-done="true"] {
      border-color: #b49661 !important;
      background: #2b2419 !important;
      color: var(--accent-2) !important;
    }

    .bar {
      border-color: #4b5c72 !important;
      background: #101621 !important;
    }

    .bar > span {
      background: linear-gradient(90deg, #9d8555, #f0d7a2) !important;
    }
  </style>
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="crt-flicker" aria-hidden="true"></div>

  <div class="shell">
    <header class="frame mast">
      <div class="mast-copy">
        <p class="kicker">Escape from Tarkov // EFTracking</p>
        <h1 class="title">Quest Board</h1>
        <nav class="top-nav" aria-label="Pages">
          <a class="nav-btn" href="./index.html" aria-current="page">Quest Board</a>
          <a class="nav-btn" href="./flea.html">Flea Prices</a>
        </nav>
      </div>
      <div class="clock-card bevel" aria-label="Clocks">
        <div class="clock-row"><span>Tarkov Weather</span><strong id="clockWeather">Loading...</strong></div>
        <div class="clock-row"><span>Tarkov Day</span><strong id="clockDay">--:--:--</strong></div>
        <div class="clock-row"><span>Tarkov Night</span><strong id="clockNight">--:--:--</strong></div>
      </div>
    </header>

    <section class="frame controls" aria-label="Controls">
      <div class="control-grid">
        <input id="searchInput" class="search" type="search" placeholder="Search quest, trader, map, objective...">
        <select id="traderSelect" class="select" aria-label="Trader filter"></select>
        <button id="kappaToggle" class="toggle" data-on="false">Kappa Only: Off</button>
        <button id="showCompletedToggle" class="toggle" data-on="true">Show Completed: On</button>
        <button id="syncCatalogBtn" class="btn">Sync Official Catalog</button>
        <button id="clearFiltersBtn" class="btn warn">Reset View</button>
        <button id="exportBtn" class="btn">Export JSON</button>
      </div>
      <div class="status-grid">
        <div id="catalogStatus" class="catalog-box bevel" data-state="idle">Catalog status: <strong id="catalogStatusText">Idle</strong></div>
        <div id="kappaBadge" class="kappa-pill bevel">Kappa Mode: <strong>Off</strong></div>
      </div>
      <input id="importInput" type="file" accept="application/json" hidden>
      <button id="importBtn" class="btn" style="display:none;">Import JSON</button>
    </section>

    <main class="workspace">
      <section class="frame board" aria-label="Quest list">
        <section id="stats" class="stats"></section>
        <section id="groups" class="group-stack" aria-live="polite"></section>
      </section>

      <aside class="frame detail" aria-label="Quest detail">
        <section id="detailPane"></section>
        <section>
          <p class="label-title">Recent Activity</p>
          <ul id="activityList" class="activity-list"></ul>
        </section>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./official-catalog-snapshot.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = "eft_tracker_state_v7";
      const OFFICIAL_CACHE_KEY = "eft_tracker_official_cache_v4";
      const OFFICIAL_CACHE_TTL_MS = 12 * 60 * 60 * 1000;
      const OFFICIAL_ENDPOINT = "https://api.tarkov.dev/graphql";
      const OFFICIAL_QUERY = `query EFTTasks($mode: GameMode) {
        tasks(gameMode: $mode) {
          id
          name
          kappaRequired
          wikiLink
          minPlayerLevel
          trader { id name }
          objectives { id description }
        }
      }`;
      const WEATHER_QUERY_CANDIDATES = [
        `query EFTWeather { weather { cloud windSpeed windDirection windGustiness rain rainIntensity fog temp pressure date time acceleration timestamp } }`,
        `query EFTWeather { weather { cloud wind_speed wind_direction wind_gustiness rain rain_intensity fog temp pressure date time acceleration timestamp } }`,
        `query EFTWeather { weather { cloud rain fog temp windSpeed windDirection timestamp } }`,
        `query EFTWeather { weather { cloud rain fog temp wind_speed wind_direction timestamp } }`
      ];
      const WEATHER_REFRESH_MS = 60 * 1000;
      const OFFLINE_OFFICIAL_TASKS = Array.isArray(window.EFT_OFFICIAL_SNAPSHOT)
        ? window.EFT_OFFICIAL_SNAPSHOT
        : [];
      const ACTIVITY_LIMIT = 18;

      const MAP_HINTS = [
        "Ground Zero",
        "Customs",
        "Factory",
        "Interchange",
        "Lighthouse",
        "Reserve",
        "Shoreline",
        "Streets of Tarkov",
        "Streets",
        "Woods",
        "Lab",
        "The Lab",
        "Labs"
      ];

      const FALLBACK_TASKS = [
        {
          id: "fallback-debut",
          title: "Debut",
          trader: "Prapor",
          map: "Customs",
          level: 1,
          description: "Eliminate Scavs and hand over MP-133 shotguns.",
          objectives: [
            { id: "fallback-debut-1", text: "Eliminate 5 Scavs on Customs", done: false },
            { id: "fallback-debut-2", text: "Hand over 2 MP-133 shotguns", done: false }
          ],
          tags: ["combat", "turn-in"],
          kappaRequired: true,
          completed: false,
          updatedAt: new Date().toISOString(),
          source: "fallback",
          wikiLink: ""
        },
        {
          id: "fallback-shortage",
          title: "Shortage",
          trader: "Therapist",
          map: "Any",
          level: 1,
          description: "Find and deliver Salewa kits for Therapist.",
          objectives: [
            { id: "fallback-shortage-1", text: "Find 3 Salewa kits", done: false },
            { id: "fallback-shortage-2", text: "Hand over all kits", done: false }
          ],
          tags: ["medical", "loot"],
          kappaRequired: true,
          completed: false,
          updatedAt: new Date().toISOString(),
          source: "fallback",
          wikiLink: ""
        }
      ];

      const state = {
        tasks: [],
        filters: {
          query: "",
          trader: "all",
          showCompleted: true,
          kappaOnly: false
        },
        selectedTaskId: null,
        activity: [],
        sync: {
          loading: false,
          lastSync: null,
          error: "",
          officialCount: 0
        }
      };

      const refs = {
        clockWeather: document.getElementById("clockWeather"),
        clockDay: document.getElementById("clockDay"),
        clockNight: document.getElementById("clockNight"),
        kappaBadge: document.getElementById("kappaBadge"),
        searchInput: document.getElementById("searchInput"),
        traderSelect: document.getElementById("traderSelect"),
        kappaToggle: document.getElementById("kappaToggle"),
        showCompletedToggle: document.getElementById("showCompletedToggle"),
        syncCatalogBtn: document.getElementById("syncCatalogBtn"),
        clearFiltersBtn: document.getElementById("clearFiltersBtn"),
        exportBtn: document.getElementById("exportBtn"),
        importBtn: document.getElementById("importBtn"),
        importInput: document.getElementById("importInput"),
        catalogStatus: document.getElementById("catalogStatus"),
        catalogStatusText: document.getElementById("catalogStatusText"),
        stats: document.getElementById("stats"),
        groups: document.getElementById("groups"),
        detailPane: document.getElementById("detailPane"),
        activityList: document.getElementById("activityList"),
        toast: document.getElementById("toast")
      };
      let weatherRefreshLock = false;

      function uid() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function writeJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          // ignore storage failures
        }
      }

      function showToast(message) {
        refs.toast.textContent = message;
        refs.toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => refs.toast.classList.remove("show"), 1800);
      }

      function addActivity(text) {
        state.activity.unshift({ id: uid(), text, at: nowIso() });
        state.activity = state.activity.slice(0, ACTIVITY_LIMIT);
      }

      function cleanObjective(objective, index) {
        return {
          id: objective?.id ? String(objective.id) : `obj-${index + 1}-${uid()}`,
          text: String(objective?.text || objective?.description || "Objective"),
          done: Boolean(objective?.done)
        };
      }

      function sanitizeTask(task, index) {
        const objectivesRaw = Array.isArray(task?.objectives) ? task.objectives : [];
        const objectives = objectivesRaw.length
          ? objectivesRaw.map((objective, objectiveIndex) => cleanObjective(objective, objectiveIndex))
          : [{ id: `obj-fallback-${index}`, text: "Complete mission objectives", done: false }];

        const clean = {
          id: String(task?.id || `task-${Date.now()}-${index}`),
          title: String(task?.title || `Task ${index + 1}`),
          trader: String(task?.trader || "Operations"),
          map: String(task?.map || "Various"),
          level: Math.max(1, Number(task?.level) || 1),
          description: String(task?.description || objectives[0]?.text || "No description"),
          objectives,
          tags: Array.isArray(task?.tags) ? task.tags.map((tag) => String(tag)) : [],
          kappaRequired: Boolean(task?.kappaRequired),
          completed: Boolean(task?.completed),
          updatedAt: task?.updatedAt || nowIso(),
          source: String(task?.source || "import"),
          wikiLink: String(task?.wikiLink || "")
        };

        const allDone = clean.objectives.length > 0 && clean.objectives.every((objective) => objective.done);
        clean.completed = clean.completed || allDone;

        return clean;
      }

      function sanitizeTaskList(list) {
        if (!Array.isArray(list)) return [];
        return list.filter((item) => item && typeof item === "object").map((item, index) => sanitizeTask(item, index));
      }

      function inferMap(name, objectiveDescriptions) {
        const combined = `${name} ${objectiveDescriptions.join(" ")}`.toLowerCase();
        for (const mapName of MAP_HINTS) {
          if (combined.includes(mapName.toLowerCase())) return mapName;
        }
        return "Various";
      }

      function normalizeOfficialTask(rawTask, index) {
        const id = String(rawTask?.id || `official-${index}`);
        const title = String(rawTask?.name || `Official Task ${index + 1}`);
        const traderName = String(rawTask?.trader?.name || "Operations");

        const objectiveDescriptions = Array.isArray(rawTask?.objectives)
          ? rawTask.objectives.map((objective) => String(objective?.description || "").trim()).filter(Boolean)
          : [];

        const objectives = objectiveDescriptions.length
          ? objectiveDescriptions.map((text, objectiveIndex) => ({
              id: String(rawTask.objectives[objectiveIndex]?.id || `official-${id}-o${objectiveIndex + 1}`),
              text,
              done: false
            }))
          : [{ id: `official-${id}-o1`, text: "Complete all official objectives", done: false }];

        return {
          id: `official:${id}`,
          title,
          trader: traderName,
          map: inferMap(title, objectiveDescriptions),
          level: Math.max(1, Number(rawTask?.minPlayerLevel) || 1),
          description: objectiveDescriptions[0] || "No objective description available.",
          objectives,
          tags: [traderName.toLowerCase().replace(/\s+/g, "-")],
          kappaRequired: Boolean(rawTask?.kappaRequired),
          completed: false,
          updatedAt: nowIso(),
          source: "official",
          wikiLink: String(rawTask?.wikiLink || "")
        };
      }

      function mergeProgress(officialTask, existingTask) {
        if (!existingTask) return officialTask;

        const byId = new Map(existingTask.objectives.map((objective) => [objective.id, objective.done]));
        const byText = new Map(existingTask.objectives.map((objective) => [objective.text.toLowerCase(), objective.done]));

        const objectives = officialTask.objectives.map((objective) => ({
          ...objective,
          done: byId.get(objective.id) ?? byText.get(objective.text.toLowerCase()) ?? false
        }));

        return {
          ...officialTask,
          objectives,
          completed: objectives.length ? objectives.every((objective) => objective.done) : existingTask.completed,
          updatedAt: existingTask.updatedAt || officialTask.updatedAt
        };
      }

      async function fetchOfficialTasks() {
        const response = await fetch(OFFICIAL_ENDPOINT, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ query: OFFICIAL_QUERY, variables: { mode: "regular" } })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const payload = await response.json();
        if (payload?.errors?.length) throw new Error(payload.errors[0]?.message || "GraphQL error");

        return Array.isArray(payload?.data?.tasks) ? payload.data.tasks : [];
      }

      function readOfficialCache() {
        const cached = readJson(OFFICIAL_CACHE_KEY, null);
        if (!cached || !Array.isArray(cached.tasks) || !cached.cachedAt) return null;
        if (Date.now() - new Date(cached.cachedAt).getTime() > OFFICIAL_CACHE_TTL_MS) return null;
        return cached;
      }

      function writeOfficialCache(tasks) {
        writeJson(OFFICIAL_CACHE_KEY, { cachedAt: nowIso(), tasks });
      }

      function applyOfficialCatalog(rawOfficialTasks, { announce = false } = {}) {
        const normalized = rawOfficialTasks.map((task, index) => normalizeOfficialTask(task, index)).filter(Boolean);
        if (!normalized.length) throw new Error("Official catalog empty");

        const existingById = new Map(state.tasks.map((task) => [task.id, task]));
        const mergedOfficial = normalized.map((task) => mergeProgress(task, existingById.get(task.id)));
        const retainedLocal = state.tasks.filter((task) => task.source !== "official" && task.source !== "fallback");

        state.tasks = [...mergedOfficial, ...retainedLocal];
        state.sync.officialCount = mergedOfficial.length;

        if (!state.tasks.some((task) => task.id === state.selectedTaskId)) {
          state.selectedTaskId = state.tasks[0]?.id || null;
        }

        if (announce) {
          addActivity(`Official catalog synced (${mergedOfficial.length} quests).`);
          showToast(`Catalog synced: ${mergedOfficial.length} quests`);
        }
      }

      async function syncOfficialCatalog({ forceNetwork = false, announce = false } = {}) {
        if (state.sync.loading) return;

        state.sync.loading = true;
        state.sync.error = "";
        renderCatalogStatus();

        try {
          const cached = !forceNetwork ? readOfficialCache() : null;
          let officialRaw;

          if (cached) {
            officialRaw = cached.tasks;
            state.sync.lastSync = cached.cachedAt;
          } else {
            officialRaw = await fetchOfficialTasks();
            writeOfficialCache(officialRaw);
            state.sync.lastSync = nowIso();
          }

          applyOfficialCatalog(officialRaw, { announce });
        } catch {
          if (OFFLINE_OFFICIAL_TASKS.length) {
            applyOfficialCatalog(OFFLINE_OFFICIAL_TASKS, { announce: false });
            state.sync.lastSync = state.sync.lastSync || nowIso();
            state.sync.error = "Live sync unavailable, using offline snapshot";
            if (announce) showToast("Live sync unavailable, loaded offline snapshot");
          } else {
            state.sync.error = "Catalog unavailable, local tasks retained";
            if (announce) showToast("Catalog sync failed");
          }
        } finally {
          state.sync.loading = false;
          rerender();
        }
      }

      function progress(task) {
        if (!task.objectives.length) return task.completed ? 100 : 0;
        const done = task.objectives.filter((objective) => objective.done).length;
        return Math.round((done / task.objectives.length) * 100);
      }

      function filteredTasks() {
        const query = state.filters.query.toLowerCase();

        return state.tasks.filter((task) => {
          if (state.filters.trader !== "all" && task.trader !== state.filters.trader) return false;
          if (!state.filters.showCompleted && task.completed) return false;
          if (state.filters.kappaOnly && !task.kappaRequired) return false;

          if (query) {
            const haystack = [
              task.title,
              task.trader,
              task.map,
              task.description,
              ...task.tags,
              ...task.objectives.map((objective) => objective.text)
            ].join(" ").toLowerCase();
            if (!haystack.includes(query)) return false;
          }

          return true;
        });
      }

      function groupedTasks(tasks) {
        const groups = new Map();
        for (const task of tasks) {
          const name = task.trader || "Operations";
          if (!groups.has(name)) groups.set(name, []);
          groups.get(name).push(task);
        }

        return [...groups.entries()].map(([name, group]) => ({ name, tasks: group }));
      }

      function updateTraderSelect() {
        const traders = [...new Set(state.tasks.map((task) => task.trader))].sort((a, b) => a.localeCompare(b));
        refs.traderSelect.innerHTML = ['<option value="all">All Traders</option>']
          .concat(traders.map((trader) => `<option value="${escapeHtml(trader)}">${escapeHtml(trader)}</option>`))
          .join("");

        refs.traderSelect.value = traders.includes(state.filters.trader) ? state.filters.trader : "all";
      }

      function renderStats(visibleTasks) {
        const total = state.tasks.length;
        const completed = state.tasks.filter((task) => task.completed).length;
        const kappaTotal = state.tasks.filter((task) => task.kappaRequired).length;
        const kappaDone = state.tasks.filter((task) => task.kappaRequired && task.completed).length;

        const cards = [
          { label: "Total Quests", value: total, sub: `${visibleTasks.length} visible` },
          { label: "Completed", value: completed, sub: `${Math.round((completed / Math.max(total, 1)) * 100)}%` },
          { label: "Kappa Required", value: kappaTotal, sub: state.filters.kappaOnly ? "Kappa filter active" : "Global" },
          { label: "Kappa Done", value: kappaDone, sub: `${Math.round((kappaDone / Math.max(kappaTotal, 1)) * 100)}%` }
        ];

        refs.stats.innerHTML = cards
          .map((card) => `
            <article class="stat">
              <p class="label">${escapeHtml(card.label)}</p>
              <p class="value">${escapeHtml(String(card.value))}</p>
              <p class="sub">${escapeHtml(card.sub)}</p>
            </article>
          `)
          .join("");
      }

      function renderCatalogStatus() {
        let stateLabel = "idle";
        let text = "Idle";

        if (state.sync.loading) {
          stateLabel = "loading";
          text = "Syncing official catalog";
        } else if (state.sync.error) {
          stateLabel = "error";
          text = state.sync.error;
        } else if (state.sync.lastSync) {
          const stamp = new Date(state.sync.lastSync).toLocaleString([], {
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });
          text = `Catalog ready (${state.sync.officialCount || 0}) // ${stamp}`;
        }

        refs.catalogStatus.dataset.state = stateLabel;
        refs.catalogStatusText.textContent = text;
        refs.syncCatalogBtn.disabled = state.sync.loading;
        refs.syncCatalogBtn.textContent = state.sync.loading ? "Syncing..." : "Sync Official Catalog";
      }

      function renderGroups(visibleTasks) {
        const groups = groupedTasks(visibleTasks);

        if (!groups.length) {
          refs.groups.innerHTML = '<div class="empty">No quests match the current view.</div>';
          return;
        }

        refs.groups.innerHTML = groups
          .map((group) => {
            const rows = group.tasks
              .map((task) => {
                const doneCount = task.objectives.filter((objective) => objective.done).length;
                const pct = progress(task);

                return `
                  <article class="mission ${task.completed ? "completed" : ""} ${state.selectedTaskId === task.id ? "active" : ""}" data-task-id="${escapeHtml(task.id)}">
                    <button class="done-btn" data-action="toggle-task" data-task-id="${escapeHtml(task.id)}" data-done="${task.completed}">${task.completed ? "✓" : "○"}</button>
                    <div class="mission-main">
                      <h4 class="mission-title">${escapeHtml(task.title)}</h4>
                      <div class="mission-meta">
                        <span class="tag">${escapeHtml(task.map)}</span>
                        <span class="tag">Lvl ${escapeHtml(String(task.level))}</span>
                        ${task.kappaRequired ? '<span class="tag kappa">Kappa</span>' : ""}
                      </div>
                    </div>
                    <div class="mission-progress">
                      <p class="label">${doneCount}/${task.objectives.length}</p>
                      <div class="bar"><span style="width:${pct}%"></span></div>
                    </div>
                  </article>
                `;
              })
              .join("");

            return `
              <section class="group">
                <header class="group-head">
                  <h3>${escapeHtml(group.name)}</h3>
                  <span>${group.tasks.length} quests</span>
                </header>
                <div class="table-head"><span></span><span>Quest</span><span>Progress</span></div>
                <div class="mission-list">${rows}</div>
              </section>
            `;
          })
          .join("");
      }

      function renderDetail() {
        const task = state.tasks.find((item) => item.id === state.selectedTaskId);

        if (!task) {
          refs.detailPane.innerHTML = '<div class="empty">Select a quest to view details.</div>';
          return;
        }

        const pct = progress(task);

        const objectiveItems = task.objectives
          .map((objective) => `
            <li class="objective ${objective.done ? "done" : ""}">
              <input type="checkbox" data-action="toggle-objective" data-task-id="${escapeHtml(task.id)}" data-objective-id="${escapeHtml(objective.id)}" ${objective.done ? "checked" : ""}>
              <span>${escapeHtml(objective.text)}</span>
            </li>
          `)
          .join("");

        const wiki = task.wikiLink
          ? `<a class="wiki" href="${escapeHtml(task.wikiLink)}" target="_blank" rel="noopener noreferrer">Open Wiki Reference</a>`
          : "";

        refs.detailPane.innerHTML = `
          <h2>${escapeHtml(task.title)}</h2>
          <p class="sub">${escapeHtml(task.trader)}</p>
          <p class="desc">${escapeHtml(task.description)}</p>
          <div class="meta-row">
            <span class="tag">Map: ${escapeHtml(task.map)}</span>
            <span class="tag">Level ${escapeHtml(String(task.level))}</span>
            <span class="tag">${task.completed ? "Completed" : "Active"}</span>
            <span class="tag">Source: ${escapeHtml(task.source)}</span>
            ${task.kappaRequired ? '<span class="tag kappa">Kappa Required</span>' : '<span class="tag">Not Kappa</span>'}
          </div>
          ${wiki}
          <div class="mission-progress" style="justify-items:start;">
            <p class="label">Mission progress ${pct}%</p>
            <div class="bar" style="max-width:none;"><span style="width:${pct}%"></span></div>
          </div>
          <p class="label-title">Objectives</p>
          <ul class="objective-list">${objectiveItems}</ul>
          <button class="btn" data-action="toggle-task" data-task-id="${escapeHtml(task.id)}">${task.completed ? "Mark Active" : "Mark Complete"}</button>
        `;
      }

      function renderActivity() {
        if (!state.activity.length) {
          refs.activityList.innerHTML = '<li class="activity">No activity yet.</li>';
          return;
        }

        refs.activityList.innerHTML = state.activity
          .map((entry) => {
            const stamp = new Date(entry.at).toLocaleString([], {
              month: "short",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            });
            return `
              <li class="activity">
                <time datetime="${escapeHtml(entry.at)}">${escapeHtml(stamp)}</time>
                <span>${escapeHtml(entry.text)}</span>
              </li>
            `;
          })
          .join("");
      }

      function renderFilterState() {
        refs.searchInput.value = state.filters.query;

        refs.kappaToggle.dataset.on = String(state.filters.kappaOnly);
        refs.kappaToggle.textContent = `Kappa Only: ${state.filters.kappaOnly ? "On" : "Off"}`;

        refs.showCompletedToggle.dataset.on = String(state.filters.showCompleted);
        refs.showCompletedToggle.textContent = `Show Completed: ${state.filters.showCompleted ? "On" : "Off"}`;

        refs.kappaBadge.innerHTML = `Kappa Mode: <strong>${state.filters.kappaOnly ? "On" : "Off"}</strong>`;
      }

      function saveState() {
        writeJson(STORAGE_KEY, {
          tasks: state.tasks,
          filters: state.filters,
          selectedTaskId: state.selectedTaskId,
          activity: state.activity,
          sync: {
            lastSync: state.sync.lastSync,
            officialCount: state.sync.officialCount
          }
        });
      }

      function rerender() {
        const visible = filteredTasks();
        updateTraderSelect();
        renderFilterState();
        renderStats(visible);
        renderCatalogStatus();
        renderGroups(visible);
        renderDetail();
        renderActivity();
        saveState();
      }

      function toggleTask(taskId) {
        const task = state.tasks.find((item) => item.id === taskId);
        if (!task) return;

        task.completed = !task.completed;
        if (task.completed) {
          task.objectives.forEach((objective) => {
            objective.done = true;
          });
          addActivity(`Quest completed: ${task.title}`);
          showToast(`Completed ${task.title}`);
        } else {
          addActivity(`Quest reopened: ${task.title}`);
          showToast(`Reopened ${task.title}`);
        }

        task.updatedAt = nowIso();
        state.selectedTaskId = task.id;
        rerender();
      }

      function toggleObjective(taskId, objectiveId) {
        const task = state.tasks.find((item) => item.id === taskId);
        if (!task) return;

        const objective = task.objectives.find((item) => item.id === objectiveId);
        if (!objective) return;

        objective.done = !objective.done;
        task.completed = task.objectives.every((item) => item.done);
        task.updatedAt = nowIso();

        addActivity(`${objective.done ? "Objective complete" : "Objective reopened"}: ${task.title}`);
        state.selectedTaskId = task.id;
        rerender();
      }

      function exportTasks() {
        const payload = {
          exportedAt: nowIso(),
          source: "eft-tracker-quest-board",
          tasks: state.tasks
        };

        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `eft_tasks_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        addActivity("Exported quest board JSON.");
        showToast("Export complete");
      }

      async function importTasks(file) {
        try {
          const content = await file.text();
          const parsed = JSON.parse(content);
          const rawTasks = Array.isArray(parsed?.tasks) ? parsed.tasks : parsed;
          const imported = sanitizeTaskList(rawTasks);

          if (!imported.length) {
            showToast("Import failed: no valid tasks found");
            return;
          }

          state.tasks = imported;
          state.selectedTaskId = imported[0]?.id || null;
          addActivity(`Imported ${imported.length} quests.`);
          showToast(`Imported ${imported.length} quests`);
          rerender();
        } catch {
          showToast("Import failed: invalid JSON file");
        }
      }

      function clearView() {
        state.filters = {
          query: "",
          trader: "all",
          showCompleted: true,
          kappaOnly: false
        };
        addActivity("View reset to defaults.");
        showToast("View reset");
        rerender();
      }

      function hydrate() {
        const saved = readJson(STORAGE_KEY, null);

        if (saved && Array.isArray(saved.tasks) && saved.tasks.length) {
          state.tasks = sanitizeTaskList(saved.tasks);
          state.filters = {
            query: String(saved.filters?.query || ""),
            trader: saved.filters?.trader || "all",
            showCompleted: typeof saved.filters?.showCompleted === "boolean" ? saved.filters.showCompleted : true,
            kappaOnly: typeof saved.filters?.kappaOnly === "boolean" ? saved.filters.kappaOnly : false
          };
          state.selectedTaskId = saved.selectedTaskId || state.tasks[0]?.id || null;
          state.activity = Array.isArray(saved.activity) ? saved.activity.slice(0, ACTIVITY_LIMIT) : [];
          state.sync.lastSync = saved.sync?.lastSync || null;
          state.sync.officialCount = Number(saved.sync?.officialCount || 0);
          return;
        }

        state.tasks = sanitizeTaskList(FALLBACK_TASKS);
        state.selectedTaskId = state.tasks[0]?.id || null;
        state.activity = [{ id: uid(), text: "Board initialized with fallback dataset.", at: nowIso() }];
      }

      function formatHHMMSS(date) {
        return [date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds()]
          .map((value) => String(value).padStart(2, "0"))
          .join(":");
      }

      function getTarkovTime(now, dayCycle) {
        const dayMs = 24 * 60 * 60 * 1000;
        const offset = (3 * 60 * 60 * 1000) + (dayCycle ? 0 : 12 * 60 * 60 * 1000);
        return new Date((offset + 7 * now.getTime()) % dayMs);
      }

      function pickWeatherValue(weather, keys) {
        for (const key of keys) {
          if (weather?.[key] !== undefined && weather?.[key] !== null && weather?.[key] !== "") {
            return weather[key];
          }
        }
        return null;
      }

      function formatWeather(weather) {
        if (!weather || typeof weather !== "object") return "Unavailable";

        const rain = Number(pickWeatherValue(weather, ["rainIntensity", "rain_intensity", "rain"]));
        const fog = Number(pickWeatherValue(weather, ["fog"]));
        const cloud = Number(pickWeatherValue(weather, ["cloud", "cloudiness"]));
        const temperature = Number(pickWeatherValue(weather, ["temp", "temperature"]));
        const windSpeed = Number(pickWeatherValue(weather, ["windSpeed", "wind_speed"]));
        const windDirection = pickWeatherValue(weather, ["windDirection", "wind_direction"]);

        const condition = [];
        if (Number.isFinite(rain)) {
          if (rain >= 0.6) condition.push("Heavy Rain");
          else if (rain >= 0.25) condition.push("Rain");
        }
        if (Number.isFinite(fog) && fog >= 0.45) condition.push("Fog");
        if (Number.isFinite(cloud)) {
          if (cloud >= 0.8) condition.push("Overcast");
          else if (cloud <= 0.25) condition.push("Clear");
        }
        if (!condition.length) condition.push("Stable");

        const parts = [condition.join(", ")];
        if (Number.isFinite(temperature)) parts.push(`${Math.round(temperature)}°C`);
        if (Number.isFinite(windSpeed)) parts.push(`Wind ${Math.round(windSpeed)}m/s`);
        if (typeof windDirection === "string" && windDirection.trim()) {
          parts.push(windDirection.trim().toUpperCase());
        } else if (Number.isFinite(Number(windDirection))) {
          parts.push(`${Math.round(Number(windDirection))}°`);
        }

        return parts.join(" // ");
      }

      async function fetchWeatherSummary() {
        for (const query of WEATHER_QUERY_CANDIDATES) {
          try {
            const response = await fetch(OFFICIAL_ENDPOINT, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ query })
            });
            if (!response.ok) continue;

            const payload = await response.json();
            if (payload?.errors?.length || !payload?.data?.weather) continue;

            return formatWeather(payload.data.weather);
          } catch {
            // try next candidate
          }
        }
        return null;
      }

      async function refreshWeather() {
        if (weatherRefreshLock) return;
        weatherRefreshLock = true;
        try {
          const summary = await fetchWeatherSummary();
          refs.clockWeather.textContent = summary || "Unavailable";
        } finally {
          weatherRefreshLock = false;
        }
      }

      function tickClocks() {
        const now = new Date();
        refs.clockDay.textContent = formatHHMMSS(getTarkovTime(now, true));
        refs.clockNight.textContent = formatHHMMSS(getTarkovTime(now, false));
      }

      function bindEvents() {
        refs.searchInput.addEventListener("input", () => {
          state.filters.query = refs.searchInput.value.trim();
          rerender();
        });

        refs.traderSelect.addEventListener("change", () => {
          state.filters.trader = refs.traderSelect.value;
          rerender();
        });

        refs.kappaToggle.addEventListener("click", () => {
          state.filters.kappaOnly = !state.filters.kappaOnly;
          rerender();
        });

        refs.showCompletedToggle.addEventListener("click", () => {
          state.filters.showCompleted = !state.filters.showCompleted;
          rerender();
        });

        refs.syncCatalogBtn.addEventListener("click", () => {
          syncOfficialCatalog({ forceNetwork: true, announce: true });
        });

        refs.clearFiltersBtn.addEventListener("click", clearView);
        refs.exportBtn.addEventListener("click", exportTasks);

        refs.groups.addEventListener("click", (event) => {
          const toggleBtn = event.target.closest("[data-action='toggle-task']");
          if (toggleBtn) {
            toggleTask(toggleBtn.dataset.taskId);
            return;
          }

          const mission = event.target.closest(".mission");
          if (!mission) return;
          const taskId = mission.dataset.taskId;
          if (!state.tasks.some((task) => task.id === taskId)) return;
          state.selectedTaskId = taskId;
          rerender();
        });

        refs.detailPane.addEventListener("click", (event) => {
          const toggleBtn = event.target.closest("[data-action='toggle-task']");
          if (toggleBtn) toggleTask(toggleBtn.dataset.taskId);
        });

        refs.detailPane.addEventListener("change", (event) => {
          const checkbox = event.target;
          if (!checkbox.matches("[data-action='toggle-objective']")) return;
          toggleObjective(checkbox.dataset.taskId, checkbox.dataset.objectiveId);
        });

        refs.importInput.addEventListener("change", () => {
          const file = refs.importInput.files?.[0];
          if (file) importTasks(file);
        });

        document.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "o") {
            event.preventDefault();
            refs.importInput.value = "";
            refs.importInput.click();
          }
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      async function init() {
        hydrate();
        bindEvents();
        tickClocks();
        setInterval(tickClocks, 1000);
        refreshWeather();
        setInterval(refreshWeather, WEATHER_REFRESH_MS);

        const existingOfficial = state.tasks.filter((task) => task.source === "official").length;
        if (existingOfficial < 120 && OFFLINE_OFFICIAL_TASKS.length > 120) {
          applyOfficialCatalog(OFFLINE_OFFICIAL_TASKS, { announce: false });
          state.sync.lastSync = nowIso();
          state.sync.error = "";
          state.filters = {
            query: "",
            trader: "all",
            showCompleted: true,
            kappaOnly: false
          };
          addActivity(`Offline official snapshot loaded (${OFFLINE_OFFICIAL_TASKS.length} quests).`);
        }

        rerender();
        await syncOfficialCatalog({ forceNetwork: existingOfficial < 120, announce: false });
      }

      init();
    })();
  </script>
</body>
</html>
