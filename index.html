<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EFTracker Command Edition</title>
  <meta name="description" content="Escape from Tarkov unified quest tracker with Kappa filtering.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a09;
      --bg-2: #0d1311;
      --surface: rgba(17, 24, 22, 0.92);
      --surface-2: rgba(13, 18, 16, 0.94);
      --line: #37453f;
      --line-strong: #556a61;
      --text: #d8ded2;
      --muted: #8f988d;
      --amber: #d4b87e;
      --amber-soft: #a98f63;
      --green: #7f9b68;
      --blue: #8097a6;
      --danger: #b86957;
      --shadow: 0 26px 60px rgba(0, 0, 0, 0.5);
      --radius: 16px;
      --radius-sm: 10px;
      --font-title: "Chakra Petch", "Eurostile", "Bank Gothic", sans-serif;
      --font-body: "IBM Plex Mono", "Consolas", "Menlo", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      background:
        radial-gradient(130% 120% at 6% -20%, rgba(185, 139, 72, 0.23), transparent 58%),
        radial-gradient(110% 130% at 100% 120%, rgba(96, 128, 84, 0.22), transparent 52%),
        linear-gradient(165deg, #060807, #0a0f0d 50%, #090d0c 100%);
      font-family: var(--font-body);
      letter-spacing: 0.01em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(212, 184, 126, 0.035) 0,
          rgba(212, 184, 126, 0.035) 1px,
          transparent 1px,
          transparent 74px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(212, 184, 126, 0.028) 0,
          rgba(212, 184, 126, 0.028) 1px,
          transparent 1px,
          transparent 74px
        );
      opacity: 0.45;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 2;
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(165deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(212, 184, 126, 0.06), transparent 45%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.012), transparent 65%);
    }

    .header {
      padding: 14px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .kicker {
      margin: 0;
      color: #8a9388;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 1px 0 0;
      color: #bcc3b7;
      font-family: var(--font-title);
      font-size: clamp(1rem, 2.1vw, 1.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: none;
    }

    .head-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      align-items: center;
    }

    .chip {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.59rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #aeb8ac;
      background: rgba(16, 22, 20, 0.66);
      white-space: nowrap;
    }

    .chip strong {
      color: var(--amber);
      font-weight: 600;
    }

    .controls {
      padding: 12px;
      display: grid;
      gap: 9px;
    }

    .row {
      display: grid;
      gap: 8px;
      align-items: center;
    }

    .row.top {
      grid-template-columns: minmax(260px, 1fr) auto auto auto;
    }

    .row.bottom {
      grid-template-columns: minmax(220px, 320px) auto;
      justify-content: start;
    }

    .search,
    .select,
    .textarea,
    .input,
    .btn,
    .toggle,
    .filter-btn {
      font: 500 0.78rem/1.2 var(--font-body);
      letter-spacing: 0.04em;
    }

    .search,
    .select,
    .textarea,
    .input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12, 17, 15, 0.9);
      color: var(--text);
      padding: 9px 10px;
    }

    .search::placeholder,
    .textarea::placeholder,
    .input::placeholder {
      color: #69756d;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .filter-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(13, 19, 17, 0.85);
      color: #bec7bc;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.64rem;
      padding: 6px 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--amber-soft);
      color: var(--amber);
    }

    .filter-btn.active {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(64, 54, 34, 0.42);
      box-shadow: inset 0 0 0 1px rgba(212, 184, 126, 0.18);
    }

    .btn,
    .toggle {
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: linear-gradient(180deg, #1a2522, #131917);
      color: #d0d8cc;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      font-size: 0.64rem;
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    .btn:hover,
    .toggle:hover {
      border-color: var(--amber-soft);
      color: var(--amber);
    }

    .btn.warn {
      border-color: #7f5c48;
      color: #dfbd95;
      background: linear-gradient(180deg, #2a1f19, #1b1410);
    }

    .btn:disabled,
    .toggle:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      border-color: var(--line);
      color: #98a295;
    }

    .toggle[data-on="true"] {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(66, 56, 35, 0.46);
    }

    :focus-visible {
      outline: 2px solid rgba(212, 184, 126, 0.58);
      outline-offset: 1px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(310px, 360px);
      gap: 12px;
      min-height: 74vh;
    }

    .board {
      padding: 12px;
      display: grid;
      gap: 10px;
      align-content: start;
      max-height: calc(100vh - 210px);
      overflow: auto;
      scrollbar-width: thin;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(13, 19, 17, 0.8);
      padding: 8px 10px;
      display: grid;
      gap: 2px;
      min-height: 70px;
    }

    .stat .label {
      margin: 0;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.11em;
      font-size: 0.58rem;
    }

    .stat .value {
      margin: 0;
      color: var(--amber);
      font-family: var(--font-title);
      font-size: 1.3rem;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .stat .sub {
      margin: 0;
      color: #9aa699;
      font-size: 0.61rem;
    }

    .catalog {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(12, 17, 16, 0.74);
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.62rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #afbaae;
    }

    .catalog strong {
      color: var(--amber);
      font-weight: 600;
    }

    .catalog[data-state="error"] strong {
      color: #e0a698;
    }

    .groups {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .group {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: rgba(10, 15, 13, 0.74);
    }

    .group-head {
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(87, 103, 95, 0.55);
      background: linear-gradient(180deg, rgba(25, 34, 31, 0.78), rgba(15, 21, 19, 0.82));
    }

    .group-head h3 {
      margin: 0;
      color: #dbc895;
      font-family: var(--font-title);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.77rem;
    }

    .group-head span {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b2bcae;
    }

    .mission-list {
      display: grid;
      gap: 0;
    }

    .mission {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(130px, 160px);
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-top: 1px solid rgba(67, 82, 75, 0.45);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .mission:first-child {
      border-top: none;
    }

    .mission:hover {
      background: rgba(36, 50, 45, 0.28);
    }

    .mission.active {
      background: rgba(62, 54, 35, 0.3);
      box-shadow: inset 2px 0 0 rgba(212, 184, 126, 0.9);
    }

    .mission.completed {
      opacity: 0.8;
    }

    .check {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(15, 21, 19, 0.86);
      color: #8e998f;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.78rem;
      line-height: 1;
    }

    .check[data-done="true"] {
      border-color: var(--green);
      background: rgba(76, 100, 57, 0.32);
      color: #d6e4c2;
    }

    .mission-main {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .mission-title {
      margin: 0;
      font-size: 0.74rem;
      letter-spacing: 0.02em;
      line-height: 1.3;
      color: #dbe1d6;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .mission-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      border: 1px solid rgba(86, 102, 94, 0.72);
      border-radius: 999px;
      padding: 2px 6px;
      color: #aeb9ad;
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(13, 19, 17, 0.76);
    }

    .tag.kappa {
      border-color: rgba(129, 155, 104, 0.9);
      color: #d1e0be;
      background: rgba(57, 75, 39, 0.4);
    }

    .mission-progress {
      display: grid;
      gap: 4px;
      justify-items: end;
    }

    .mission-progress .label {
      margin: 0;
      font-size: 0.57rem;
      color: #95a193;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: right;
    }

    .bar {
      width: 100%;
      max-width: 130px;
      border: 1px solid rgba(82, 98, 91, 0.74);
      border-radius: 999px;
      height: 7px;
      overflow: hidden;
      background: #0b100f;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #728a5e, #d4b87e);
      transition: width 0.2s ease;
    }

    .empty {
      border: 1px dashed rgba(84, 101, 94, 0.84);
      border-radius: var(--radius-sm);
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      background: rgba(11, 16, 15, 0.72);
    }

    .detail {
      padding: 12px;
      display: grid;
      gap: 10px;
      align-content: start;
      max-height: calc(100vh - 210px);
      overflow: auto;
      scrollbar-width: thin;
    }

    .detail h2 {
      margin: 0;
      color: var(--amber);
      font-family: var(--font-title);
      font-size: 0.96rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      line-height: 1.35;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.11em;
      font-size: 0.58rem;
    }

    .desc {
      margin: 0;
      color: #b5bfae;
      font-size: 0.68rem;
      line-height: 1.5;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .wiki {
      width: fit-content;
      color: #bed0e6;
      text-decoration: none;
      font-size: 0.61rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      border-bottom: 1px dotted rgba(190, 208, 230, 0.45);
    }

    .wiki:hover {
      color: #d6e6fb;
      border-bottom-color: rgba(214, 230, 251, 0.8);
    }

    .label-title {
      margin: 0;
      color: var(--muted);
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .objective-list,
    .activity-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }

    .objective {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(14, 20, 18, 0.78);
      padding: 7px;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 0.68rem;
      line-height: 1.4;
      color: #c2ccbe;
    }

    .objective input {
      margin-top: 1px;
      accent-color: var(--amber-soft);
    }

    .objective.done {
      border-color: rgba(121, 145, 98, 0.9);
      color: #9eac99;
      text-decoration: line-through;
    }

    .activity {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12, 18, 16, 0.72);
      padding: 7px;
      display: grid;
      gap: 2px;
      color: #afb8ad;
      font-size: 0.61rem;
      line-height: 1.35;
    }

    .activity time {
      color: #8f9a8d;
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(110%);
      bottom: 14px;
      z-index: 10001;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(13, 19, 17, 0.96);
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-size: 0.62rem;
      padding: 9px 13px;
      transition: transform 0.24s ease;
      pointer-events: none;
      max-width: min(92vw, 760px);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background:
        radial-gradient(circle, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.74) 100%),
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.085), rgba(0, 255, 0, 0.03), rgba(0, 0, 255, 0.085));
      background-size: 100% 100%, 100% 2px, 3px 100%;
      opacity: 0.9;
    }

    .screen-flicker {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.012);
      opacity: 0;
      animation: flicker 0.36s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.006; }
      50% { opacity: 0.018; }
      100% { opacity: 0.006; }
    }

    @media (max-width: 1280px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .board,
      .detail {
        max-height: none;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1020px) {
      .app {
        padding: 10px;
      }

      .header {
        grid-template-columns: 1fr;
      }

      .head-meta {
        justify-content: flex-start;
      }

      .row.top,
      .row.bottom {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .mission {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .mission-progress {
        grid-column: 1 / -1;
        justify-items: start;
      }

      .bar {
        max-width: none;
      }

    }
  </style>
</head>
<body>
  <div class="app">
    <header class="panel header">
      <div>
        <p class="kicker">Escape From Tarkov // Unified Quest Tracker</p>
        <h1>Quest Command Board</h1>
      </div>
      <div class="head-meta">
        <span class="chip">Clock <strong id="clock">--:--:--</strong></span>
        <span class="chip" id="kappaBadge">Kappa Mode <strong>OFF</strong></span>
      </div>
    </header>

    <section class="panel controls" aria-label="Controls">
      <div class="row top">
        <input id="searchInput" class="search" type="search" placeholder="Search task name, trader, objective, map...">
        <button id="kappaToggle" class="toggle" data-on="false">Kappa Only: Off</button>
        <button id="showCompletedToggle" class="toggle" data-on="true">Show Completed: On</button>
        <button id="syncCatalogBtn" class="btn">Sync Official Catalog</button>
      </div>
      <div class="row bottom">
        <select id="traderSelect" class="select" aria-label="Trader filter"></select>
        <button id="clearFiltersBtn" class="btn warn">Reset View</button>
      </div>
    </section>

    <section class="layout">
      <main class="panel board" aria-label="Task board">
        <section id="stats" class="stats"></section>

        <div id="catalogStatus" class="catalog" data-state="idle">
          <span id="catalogStatusText">Catalog status: <strong>Idle</strong></span>
          <div class="filter-bar">
            <button id="exportBtn" class="btn">Export JSON</button>
            <button id="importBtn" class="btn">Import JSON</button>
            <input id="importInput" type="file" accept="application/json" hidden>
          </div>
        </div>

        <section id="groups" class="groups" aria-live="polite"></section>
      </main>

      <aside class="panel detail" aria-label="Task detail">
        <section id="detailPane"></section>
        <section>
          <p class="label-title">Recent Activity</p>
          <ul id="activityList" class="activity-list"></ul>
        </section>
      </aside>
    </section>
  </div>

  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="screen-flicker" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="./official-catalog-snapshot.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = "eft_tracker_state_v5";
      const OFFICIAL_CACHE_KEY = "eft_tracker_official_cache_v2";
      const OFFICIAL_CACHE_TTL_MS = 12 * 60 * 60 * 1000;
      const OFFICIAL_ENDPOINT = "https://api.tarkov.dev/graphql";
      const OFFICIAL_QUERY = `query EFTTasks {
        tasks {
          id
          name
          kappaRequired
          wikiLink
          minPlayerLevel
          trader { id name }
          objectives { id description }
        }
      }`;
      const OFFLINE_OFFICIAL_TASKS = Array.isArray(window.EFT_OFFICIAL_SNAPSHOT)
        ? window.EFT_OFFICIAL_SNAPSHOT
        : [];
      const ACTIVITY_LIMIT = 16;

      const MAP_HINTS = [
        "Ground Zero",
        "Customs",
        "Factory",
        "Interchange",
        "Lighthouse",
        "Reserve",
        "Shoreline",
        "Streets of Tarkov",
        "Streets",
        "Woods",
        "Lab",
        "The Lab",
        "Labs"
      ];

      const FALLBACK_TASKS = [
        {
          id: "fallback-debut",
          title: "Debut",
          trader: "Prapor",
          map: "Customs",
          level: 1,
          description: "Eliminate scavs and hand over MP-133 shotguns for initial trust.",
          objectives: [
            { id: "fallback-debut-1", text: "Eliminate 5 Scavs on Customs", done: false },
            { id: "fallback-debut-2", text: "Hand over 2 MP-133 shotguns", done: false }
          ],
          tags: ["early", "combat"],
          kappaRequired: true,
          completed: false,
          updatedAt: new Date().toISOString(),
          source: "fallback",
          wikiLink: ""
        },
        {
          id: "fallback-shortage",
          title: "Shortage",
          trader: "Therapist",
          map: "Any",
          level: 1,
          description: "Find and deliver Salewa kits to Therapist.",
          objectives: [
            { id: "fallback-shortage-1", text: "Find 3 Salewa kits", done: false },
            { id: "fallback-shortage-2", text: "Hand over all kits", done: false }
          ],
          tags: ["medical", "loot"],
          kappaRequired: true,
          completed: false,
          updatedAt: new Date().toISOString(),
          source: "fallback",
          wikiLink: ""
        }
      ];

      const state = {
        tasks: [],
        filters: {
          query: "",
          trader: "all",
          showCompleted: true,
          kappaOnly: false
        },
        selectedTaskId: null,
        activity: [],
        sync: {
          loading: false,
          lastSync: null,
          error: "",
          officialCount: 0
        }
      };

      const refs = {
        clock: document.getElementById("clock"),
        kappaBadge: document.getElementById("kappaBadge"),
        searchInput: document.getElementById("searchInput"),
        kappaToggle: document.getElementById("kappaToggle"),
        showCompletedToggle: document.getElementById("showCompletedToggle"),
        syncCatalogBtn: document.getElementById("syncCatalogBtn"),
        traderSelect: document.getElementById("traderSelect"),
        clearFiltersBtn: document.getElementById("clearFiltersBtn"),
        stats: document.getElementById("stats"),
        catalogStatus: document.getElementById("catalogStatus"),
        catalogStatusText: document.getElementById("catalogStatusText"),
        groups: document.getElementById("groups"),
        detailPane: document.getElementById("detailPane"),
        activityList: document.getElementById("activityList"),
        exportBtn: document.getElementById("exportBtn"),
        importBtn: document.getElementById("importBtn"),
        importInput: document.getElementById("importInput"),
        toast: document.getElementById("toast")
      };

      function uid() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }
        return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function nowIso() {
        return new Date().toISOString();
      }

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function writeJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          // ignore
        }
      }

      function showToast(message) {
        refs.toast.textContent = message;
        refs.toast.classList.add("show");
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => refs.toast.classList.remove("show"), 1800);
      }

      function addActivity(text) {
        state.activity.unshift({ id: uid(), text, at: nowIso() });
        state.activity = state.activity.slice(0, ACTIVITY_LIMIT);
      }

      function cleanObjective(objective, index) {
        return {
          id: objective?.id ? String(objective.id) : `obj-${index + 1}-${uid()}`,
          text: String(objective?.text || objective?.description || "Objective"),
          done: Boolean(objective?.done)
        };
      }

      function sanitizeTask(task, index) {
        const objectivesRaw = Array.isArray(task?.objectives) ? task.objectives : [];
        const objectives = objectivesRaw.length
          ? objectivesRaw.map((objective, objectiveIndex) => cleanObjective(objective, objectiveIndex))
          : [{ id: `obj-fallback-${index}`, text: "Complete mission objectives", done: false }];

        const clean = {
          id: String(task?.id || `task-${Date.now()}-${index}`),
          title: String(task?.title || `Task ${index + 1}`),
          trader: String(task?.trader || "Operations"),
          map: String(task?.map || "Various"),
          level: Math.max(1, Number(task?.level) || 1),
          description: String(task?.description || objectives[0]?.text || "No description"),
          objectives,
          tags: Array.isArray(task?.tags) ? task.tags.map((tag) => String(tag)) : [],
          kappaRequired: Boolean(task?.kappaRequired),
          completed: Boolean(task?.completed),
          updatedAt: task?.updatedAt || nowIso(),
          source: String(task?.source || "import"),
          wikiLink: String(task?.wikiLink || "")
        };

        const allDone = clean.objectives.length > 0 && clean.objectives.every((objective) => objective.done);
        clean.completed = clean.completed || allDone;

        return clean;
      }

      function sanitizeTaskList(list) {
        if (!Array.isArray(list)) return [];
        return list.filter((item) => item && typeof item === "object").map((item, index) => sanitizeTask(item, index));
      }

      function inferMap(name, objectiveDescriptions) {
        const combined = `${name} ${objectiveDescriptions.join(" ")}`.toLowerCase();
        for (const mapName of MAP_HINTS) {
          if (combined.includes(mapName.toLowerCase())) return mapName;
        }
        return "Various";
      }

      function normalizeOfficialTask(rawTask, index) {
        const id = String(rawTask?.id || `official-${index}`);
        const title = String(rawTask?.name || `Official Task ${index + 1}`);
        const traderName = String(rawTask?.trader?.name || "Operations");

        const objectiveDescriptions = Array.isArray(rawTask?.objectives)
          ? rawTask.objectives.map((objective) => String(objective?.description || "").trim()).filter(Boolean)
          : [];

        const objectives = objectiveDescriptions.length
          ? objectiveDescriptions.map((text, objectiveIndex) => ({
              id: String(rawTask.objectives[objectiveIndex]?.id || `official-${id}-o${objectiveIndex + 1}`),
              text,
              done: false
            }))
          : [{ id: `official-${id}-o1`, text: "Complete all official objectives", done: false }];

        return {
          id: `official:${id}`,
          title,
          trader: traderName,
          map: inferMap(title, objectiveDescriptions),
          level: Math.max(1, Number(rawTask?.minPlayerLevel) || 1),
          description: objectiveDescriptions[0] || "No objective description available.",
          objectives,
          tags: [traderName.toLowerCase().replace(/\s+/g, "-")],
          kappaRequired: Boolean(rawTask?.kappaRequired),
          completed: false,
          updatedAt: nowIso(),
          source: "official",
          wikiLink: String(rawTask?.wikiLink || "")
        };
      }

      function mergeProgress(officialTask, existingTask) {
        if (!existingTask) return officialTask;

        const byId = new Map(existingTask.objectives.map((objective) => [objective.id, objective.done]));
        const byText = new Map(existingTask.objectives.map((objective) => [objective.text.toLowerCase(), objective.done]));

        const objectives = officialTask.objectives.map((objective) => ({
          ...objective,
          done: byId.get(objective.id) ?? byText.get(objective.text.toLowerCase()) ?? false
        }));

        return {
          ...officialTask,
          objectives,
          completed: objectives.length ? objectives.every((objective) => objective.done) : existingTask.completed,
          updatedAt: existingTask.updatedAt || officialTask.updatedAt
        };
      }

      async function fetchOfficialTasks() {
        const response = await fetch(OFFICIAL_ENDPOINT, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ query: OFFICIAL_QUERY })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const payload = await response.json();
        if (payload?.errors?.length) throw new Error(payload.errors[0]?.message || "GraphQL error");

        return Array.isArray(payload?.data?.tasks) ? payload.data.tasks : [];
      }

      function readOfficialCache() {
        const cached = readJson(OFFICIAL_CACHE_KEY, null);
        if (!cached || !Array.isArray(cached.tasks) || !cached.cachedAt) return null;
        if (Date.now() - new Date(cached.cachedAt).getTime() > OFFICIAL_CACHE_TTL_MS) return null;
        return cached;
      }

      function writeOfficialCache(tasks) {
        writeJson(OFFICIAL_CACHE_KEY, { cachedAt: nowIso(), tasks });
      }

      function applyOfficialCatalog(rawOfficialTasks, { announce = false } = {}) {
        const normalized = rawOfficialTasks.map((task, index) => normalizeOfficialTask(task, index)).filter(Boolean);
        if (!normalized.length) throw new Error("Official catalog empty");

        const existingById = new Map(state.tasks.map((task) => [task.id, task]));
        const mergedOfficial = normalized.map((task) => mergeProgress(task, existingById.get(task.id)));
        const retainedLocal = state.tasks.filter((task) => task.source !== "official" && task.source !== "fallback");

        state.tasks = [...mergedOfficial, ...retainedLocal];
        state.sync.officialCount = mergedOfficial.length;

        if (!state.tasks.some((task) => task.id === state.selectedTaskId)) {
          state.selectedTaskId = state.tasks[0]?.id || null;
        }

        if (announce) {
          addActivity(`Official catalog synced (${mergedOfficial.length} tasks).`);
          showToast(`Catalog synced: ${mergedOfficial.length} tasks`);
        }
      }

      async function syncOfficialCatalog({ forceNetwork = false, announce = false } = {}) {
        if (state.sync.loading) return;

        state.sync.loading = true;
        state.sync.error = "";
        renderCatalogStatus();

        try {
          const cached = !forceNetwork ? readOfficialCache() : null;
          let officialRaw;

          if (cached) {
            officialRaw = cached.tasks;
            state.sync.lastSync = cached.cachedAt;
          } else {
            officialRaw = await fetchOfficialTasks();
            writeOfficialCache(officialRaw);
            state.sync.lastSync = nowIso();
          }

          applyOfficialCatalog(officialRaw, { announce });
        } catch {
          if (OFFLINE_OFFICIAL_TASKS.length) {
            applyOfficialCatalog(OFFLINE_OFFICIAL_TASKS, { announce: false });
            state.sync.lastSync = state.sync.lastSync || nowIso();
            state.sync.error = "Live sync unavailable, using offline snapshot";
            if (announce) showToast("Live sync unavailable, loaded offline snapshot");
          } else {
            state.sync.error = "Catalog unavailable, local tasks retained";
            if (announce) showToast("Catalog sync failed");
          }
        } finally {
          state.sync.loading = false;
          rerender();
        }
      }

      function progress(task) {
        if (!task.objectives.length) return task.completed ? 100 : 0;
        const done = task.objectives.filter((objective) => objective.done).length;
        return Math.round((done / task.objectives.length) * 100);
      }

      function filteredTasks() {
        const query = state.filters.query.toLowerCase();

        return state.tasks.filter((task) => {
          if (state.filters.trader !== "all" && task.trader !== state.filters.trader) return false;
          if (!state.filters.showCompleted && task.completed) return false;
          if (state.filters.kappaOnly && !task.kappaRequired) return false;

          if (query) {
            const haystack = [
              task.title,
              task.trader,
              task.map,
              task.description,
              ...task.tags,
              ...task.objectives.map((objective) => objective.text)
            ].join(" ").toLowerCase();
            if (!haystack.includes(query)) return false;
          }

          return true;
        });
      }

      function groupedTasks(tasks) {
        const groups = new Map();
        for (const task of tasks) {
          const name = task.trader || "Operations";
          if (!groups.has(name)) groups.set(name, []);
          groups.get(name).push(task);
        }

        return [...groups.entries()].map(([name, group]) => ({ name, tasks: group }));
      }

      function updateTraderSelect() {
        const traders = [...new Set(state.tasks.map((task) => task.trader))].sort((a, b) => a.localeCompare(b));
        refs.traderSelect.innerHTML = ['<option value="all">All Traders / Chains</option>']
          .concat(traders.map((trader) => `<option value="${escapeHtml(trader)}">${escapeHtml(trader)}</option>`))
          .join("");

        refs.traderSelect.value = traders.includes(state.filters.trader) ? state.filters.trader : "all";
      }

      function renderStats(visibleTasks) {
        const total = state.tasks.length;
        const completed = state.tasks.filter((task) => task.completed).length;
        const kappaTotal = state.tasks.filter((task) => task.kappaRequired).length;
        const kappaDone = state.tasks.filter((task) => task.kappaRequired && task.completed).length;

        const cards = [
          { label: "Total", value: total, sub: `${visibleTasks.length} visible` },
          { label: "Completed", value: completed, sub: `${Math.round((completed / Math.max(total, 1)) * 100)}% progress` },
          { label: "Kappa Tasks", value: kappaTotal, sub: `${state.filters.kappaOnly ? "Kappa filter active" : "Global count"}` },
          { label: "Kappa Done", value: kappaDone, sub: `${Math.round((kappaDone / Math.max(kappaTotal, 1)) * 100)}% Kappa` }
        ];

        refs.stats.innerHTML = cards
          .map((card) => `
            <article class="stat">
              <p class="label">${escapeHtml(String(card.label))}</p>
              <p class="value">${escapeHtml(String(card.value))}</p>
              <p class="sub">${escapeHtml(String(card.sub))}</p>
            </article>
          `)
          .join("");
      }

      function renderCatalogStatus() {
        let stateLabel = "idle";
        let text = "Idle";

        if (state.sync.loading) {
          stateLabel = "loading";
          text = "Syncing official catalog";
        } else if (state.sync.error) {
          stateLabel = "error";
          text = state.sync.error;
        } else if (state.sync.lastSync) {
          const stamp = new Date(state.sync.lastSync).toLocaleString([], {
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          });
          text = `Catalog ready (${state.sync.officialCount || 0}) // ${stamp}`;
        }

        refs.catalogStatus.dataset.state = stateLabel;
        refs.catalogStatusText.innerHTML = `Catalog status: <strong>${escapeHtml(text)}</strong>`;
        refs.syncCatalogBtn.disabled = state.sync.loading;
        refs.syncCatalogBtn.textContent = state.sync.loading ? "Syncing..." : "Sync Official Catalog";
      }

      function renderGroups(visibleTasks) {
        const groups = groupedTasks(visibleTasks);

        if (!groups.length) {
          refs.groups.innerHTML = '<div class="empty">No tasks match the current view.</div>';
          return;
        }

        refs.groups.innerHTML = groups
          .map((group) => {
            const rows = group.tasks
              .map((task) => {
                const doneCount = task.objectives.filter((objective) => objective.done).length;
                const pct = progress(task);

                return `
                  <article class="mission ${task.completed ? "completed" : ""} ${state.selectedTaskId === task.id ? "active" : ""}" data-task-id="${escapeHtml(task.id)}">
                    <button class="check" data-action="toggle-task" data-task-id="${escapeHtml(task.id)}" data-done="${task.completed}">${task.completed ? "✓" : "○"}</button>
                    <div class="mission-main">
                      <h4 class="mission-title">${escapeHtml(task.title)}</h4>
                      <div class="mission-meta">
                        <span class="tag">${escapeHtml(task.trader)}</span>
                        <span class="tag">${escapeHtml(task.map)}</span>
                        <span class="tag">Lvl ${escapeHtml(String(task.level))}</span>
                        ${task.kappaRequired ? '<span class="tag kappa">Kappa Required</span>' : ""}
                      </div>
                    </div>
                    <div class="mission-progress">
                      <p class="label">${doneCount}/${task.objectives.length} objectives</p>
                      <div class="bar"><span style="width:${pct}%"></span></div>
                    </div>
                  </article>
                `;
              })
              .join("");

            return `
              <section class="group">
                <header class="group-head">
                  <h3>${escapeHtml(group.name)}</h3>
                  <span>${group.tasks.length} tasks</span>
                </header>
                <div class="mission-list">${rows}</div>
              </section>
            `;
          })
          .join("");
      }

      function renderDetail() {
        const task = state.tasks.find((item) => item.id === state.selectedTaskId);

        if (!task) {
          refs.detailPane.innerHTML = '<div class="empty">Select a task to view details.</div>';
          return;
        }

        const pct = progress(task);

        const objectiveItems = task.objectives
          .map((objective) => `
            <li class="objective ${objective.done ? "done" : ""}">
              <input type="checkbox" data-action="toggle-objective" data-task-id="${escapeHtml(task.id)}" data-objective-id="${escapeHtml(objective.id)}" ${objective.done ? "checked" : ""}>
              <span>${escapeHtml(objective.text)}</span>
            </li>
          `)
          .join("");

        const wiki = task.wikiLink
          ? `<a class="wiki" href="${escapeHtml(task.wikiLink)}" target="_blank" rel="noopener noreferrer">Open Wiki Reference</a>`
          : "";

        refs.detailPane.innerHTML = `
          <h2>${escapeHtml(task.title)}</h2>
          <p class="sub">${escapeHtml(task.trader)}</p>
          <p class="desc">${escapeHtml(task.description)}</p>
          <div class="meta-row">
            <span class="tag">Map: ${escapeHtml(task.map)}</span>
            <span class="tag">Level ${escapeHtml(String(task.level))}</span>
            <span class="tag">${task.completed ? "Completed" : "Active"}</span>
            <span class="tag">Source: ${escapeHtml(task.source)}</span>
            ${task.kappaRequired ? '<span class="tag kappa">Kappa Required</span>' : '<span class="tag">Not Kappa</span>'}
          </div>
          ${wiki}
          <div class="mission-progress" style="justify-items:start;">
            <p class="label" style="text-align:left;">Mission progress ${pct}%</p>
            <div class="bar" style="max-width:none;"><span style="width:${pct}%"></span></div>
          </div>
          <p class="label-title">Objectives</p>
          <ul class="objective-list">${objectiveItems}</ul>
          <button class="btn" data-action="toggle-task" data-task-id="${escapeHtml(task.id)}">${task.completed ? "Mark Active" : "Mark Complete"}</button>
        `;
      }

      function renderActivity() {
        if (!state.activity.length) {
          refs.activityList.innerHTML = '<li class="activity">No activity yet.</li>';
          return;
        }

        refs.activityList.innerHTML = state.activity
          .map((entry) => {
            const stamp = new Date(entry.at).toLocaleString([], {
              month: "short",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit"
            });
            return `
              <li class="activity">
                <time datetime="${escapeHtml(entry.at)}">${escapeHtml(stamp)}</time>
                <span>${escapeHtml(entry.text)}</span>
              </li>
            `;
          })
          .join("");
      }

      function renderFilterState() {
        refs.searchInput.value = state.filters.query;

        refs.kappaToggle.dataset.on = String(state.filters.kappaOnly);
        refs.kappaToggle.textContent = `Kappa Only: ${state.filters.kappaOnly ? "On" : "Off"}`;

        refs.showCompletedToggle.dataset.on = String(state.filters.showCompleted);
        refs.showCompletedToggle.textContent = `Show Completed: ${state.filters.showCompleted ? "On" : "Off"}`;

        refs.kappaBadge.innerHTML = `Kappa Mode <strong>${state.filters.kappaOnly ? "ON" : "OFF"}</strong>`;
      }

      function saveState() {
        writeJson(STORAGE_KEY, {
          tasks: state.tasks,
          filters: state.filters,
          selectedTaskId: state.selectedTaskId,
          activity: state.activity,
          sync: {
            lastSync: state.sync.lastSync,
            officialCount: state.sync.officialCount
          }
        });
      }

      function rerender() {
        const visible = filteredTasks();
        updateTraderSelect();
        renderFilterState();
        renderStats(visible);
        renderCatalogStatus();
        renderGroups(visible);
        renderDetail();
        renderActivity();
        saveState();
      }

      function toggleTask(taskId) {
        const task = state.tasks.find((item) => item.id === taskId);
        if (!task) return;

        task.completed = !task.completed;
        if (task.completed) {
          task.objectives.forEach((objective) => {
            objective.done = true;
          });
          addActivity(`Task completed: ${task.title}`);
          showToast(`Completed ${task.title}`);
        } else {
          addActivity(`Task reopened: ${task.title}`);
          showToast(`Reopened ${task.title}`);
        }

        task.updatedAt = nowIso();
        state.selectedTaskId = task.id;
        rerender();
      }

      function toggleObjective(taskId, objectiveId) {
        const task = state.tasks.find((item) => item.id === taskId);
        if (!task) return;

        const objective = task.objectives.find((item) => item.id === objectiveId);
        if (!objective) return;

        objective.done = !objective.done;
        task.completed = task.objectives.every((item) => item.done);
        task.updatedAt = nowIso();

        addActivity(`${objective.done ? "Objective complete" : "Objective reopened"}: ${task.title}`);
        state.selectedTaskId = task.id;
        rerender();
      }

      function exportTasks() {
        const payload = {
          exportedAt: nowIso(),
          source: "eft-tracker-command-edition",
          tasks: state.tasks
        };

        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `eft_tasks_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        addActivity("Exported task board JSON.");
        showToast("Export complete");
      }

      async function importTasks(file) {
        try {
          const content = await file.text();
          const parsed = JSON.parse(content);
          const rawTasks = Array.isArray(parsed?.tasks) ? parsed.tasks : parsed;
          const imported = sanitizeTaskList(rawTasks);

          if (!imported.length) {
            showToast("Import failed: no valid tasks found");
            return;
          }

          state.tasks = imported;
          state.selectedTaskId = imported[0]?.id || null;
          addActivity(`Imported ${imported.length} tasks.`);
          showToast(`Imported ${imported.length} tasks`);
          rerender();
        } catch {
          showToast("Import failed: invalid JSON file");
        }
      }

      function clearView() {
        state.filters = {
          query: "",
          trader: "all",
          showCompleted: true,
          kappaOnly: false
        };
        addActivity("View reset to defaults.");
        showToast("View reset");
        rerender();
      }

      function hydrate() {
        const saved = readJson(STORAGE_KEY, null);

        if (saved && Array.isArray(saved.tasks) && saved.tasks.length) {
          state.tasks = sanitizeTaskList(saved.tasks);
          state.filters = {
            query: String(saved.filters?.query || ""),
            trader: saved.filters?.trader || "all",
            showCompleted: typeof saved.filters?.showCompleted === "boolean" ? saved.filters.showCompleted : true,
            kappaOnly: typeof saved.filters?.kappaOnly === "boolean" ? saved.filters.kappaOnly : false
          };
          state.selectedTaskId = saved.selectedTaskId || state.tasks[0]?.id || null;
          state.activity = Array.isArray(saved.activity) ? saved.activity.slice(0, ACTIVITY_LIMIT) : [];
          state.sync.lastSync = saved.sync?.lastSync || null;
          state.sync.officialCount = Number(saved.sync?.officialCount || 0);
          return;
        }

        state.tasks = sanitizeTaskList(FALLBACK_TASKS);
        state.selectedTaskId = state.tasks[0]?.id || null;
        state.activity = [{ id: uid(), text: "Board initialized with fallback dataset.", at: nowIso() }];
      }

      function updateClock() {
        refs.clock.textContent = new Date().toLocaleTimeString([], {
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      }

      function bindEvents() {
        refs.searchInput.addEventListener("input", () => {
          state.filters.query = refs.searchInput.value.trim();
          rerender();
        });

        refs.kappaToggle.addEventListener("click", () => {
          state.filters.kappaOnly = !state.filters.kappaOnly;
          rerender();
        });

        refs.showCompletedToggle.addEventListener("click", () => {
          state.filters.showCompleted = !state.filters.showCompleted;
          rerender();
        });

        refs.syncCatalogBtn.addEventListener("click", () => {
          syncOfficialCatalog({ forceNetwork: true, announce: true });
        });

        refs.traderSelect.addEventListener("change", () => {
          state.filters.trader = refs.traderSelect.value;
          rerender();
        });
        refs.clearFiltersBtn.addEventListener("click", clearView);

        refs.groups.addEventListener("click", (event) => {
          const toggleBtn = event.target.closest("[data-action='toggle-task']");
          if (toggleBtn) {
            toggleTask(toggleBtn.dataset.taskId);
            return;
          }

          const mission = event.target.closest(".mission");
          if (mission) {
            const taskId = mission.dataset.taskId;
            if (state.tasks.some((task) => task.id === taskId)) {
              state.selectedTaskId = taskId;
              rerender();
            }
          }
        });

        refs.detailPane.addEventListener("click", (event) => {
          const toggleBtn = event.target.closest("[data-action='toggle-task']");
          if (toggleBtn) toggleTask(toggleBtn.dataset.taskId);
        });

        refs.detailPane.addEventListener("change", (event) => {
          const checkbox = event.target;
          if (!checkbox.matches("[data-action='toggle-objective']")) return;
          toggleObjective(checkbox.dataset.taskId, checkbox.dataset.objectiveId);
        });

        refs.exportBtn.addEventListener("click", exportTasks);
        refs.importBtn.addEventListener("click", () => {
          refs.importInput.value = "";
          refs.importInput.click();
        });

        refs.importInput.addEventListener("change", () => {
          const file = refs.importInput.files?.[0];
          if (file) importTasks(file);
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      async function init() {
        hydrate();
        bindEvents();
        updateClock();
        setInterval(updateClock, 1000);

        const hasLargeOfficial = state.tasks.filter((task) => task.source === "official").length > 100;
        if (!hasLargeOfficial && OFFLINE_OFFICIAL_TASKS.length > 100) {
          applyOfficialCatalog(OFFLINE_OFFICIAL_TASKS, { announce: false });
          state.sync.lastSync = nowIso();
          state.sync.error = "";
          state.filters = {
            query: "",
            trader: "all",
            showCompleted: true,
            kappaOnly: false
          };
          addActivity(`Offline official snapshot loaded (${OFFLINE_OFFICIAL_TASKS.length} tasks).`);
        }

        if (state.tasks.length > 100 && filteredTasks().length === 0) {
          state.filters = {
            query: "",
            trader: "all",
            showCompleted: true,
            kappaOnly: false
          };
          addActivity("View filters auto-reset to reveal full catalog.");
        }

        rerender();
        await syncOfficialCatalog({ forceNetwork: !hasLargeOfficial, announce: false });
      }

      init();
    })();
  </script>
</body>
</html>
