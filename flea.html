<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EFTracker Flea Prices</title>
  <meta name="description" content="Escape from Tarkov flea market search with PvP/PvE mode toggle and live pricing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050905;
      --bg-soft: #0a130a;
      --panel: #101b10;
      --panel-2: #0b140b;
      --line: #3d5a3d;
      --line-bright: #557755;
      --text: #d6ecd0;
      --muted: #8ea08a;
      --accent: #9fd08f;
      --accent-2: #ccf8bc;
      --warn: #d6be8f;
      --danger: #d48b7b;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
      --radius: 9px;
      --font-head: "VT323", "Courier New", monospace;
      --font-body: "IBM Plex Mono", "Consolas", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(120% 90% at 8% -10%, rgba(132, 178, 108, 0.18), transparent 55%),
        radial-gradient(120% 130% at 100% 120%, rgba(96, 126, 78, 0.15), transparent 54%),
        linear-gradient(170deg, #040704, #060b06 45%, #050905);
      color: var(--text);
      font-family: var(--font-body);
      letter-spacing: 0.01em;
    }

    body {
      padding: 12px;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      background:
        radial-gradient(circle, rgba(0, 0, 0, 0) 56%, rgba(0, 0, 0, 0.72) 100%),
        linear-gradient(rgba(15, 20, 15, 0) 50%, rgba(0, 0, 0, 0.34) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.07), rgba(0, 255, 0, 0.03), rgba(0, 0, 255, 0.07));
      background-size: 100% 100%, 100% 2px, 3px 100%;
      opacity: 0.9;
    }

    .crt-flicker {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.012);
      opacity: 0;
      animation: flicker 0.36s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.006; }
      50% { opacity: 0.017; }
      100% { opacity: 0.006; }
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(1520px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .frame {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(28, 43, 28, 0.85);
      position: relative;
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(170, 214, 157, 0.06), transparent 42%);
    }

    .bevel {
      border: 1px solid #243824;
      box-shadow:
        inset 1px 1px 0 rgba(168, 212, 152, 0.14),
        inset -1px -1px 0 rgba(6, 10, 6, 0.75);
      border-radius: 7px;
    }

    .mast {
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
      gap: 10px;
      align-items: center;
    }

    .kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.61rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
    }

    .title {
      margin: 0;
      color: #b7ccb1;
      font: 500 clamp(1.25rem, 2.1vw, 1.7rem)/1 var(--font-head);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .top-nav {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #bdd1b7;
      background: linear-gradient(180deg, #1a291a, #142114);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      box-shadow: inset 1px 1px 0 rgba(170, 210, 154, 0.14), inset -1px -1px 0 rgba(6, 10, 6, 0.75);
    }

    .nav-btn[aria-current="page"],
    .nav-btn:hover {
      color: var(--accent-2);
      border-color: var(--line-bright);
      background: linear-gradient(180deg, #203420, #162816);
    }

    .clock-card {
      padding: 8px;
      display: grid;
      gap: 4px;
      background: rgba(10, 17, 10, 0.88);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .clock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #9db098;
      border-bottom: 1px dotted rgba(83, 113, 83, 0.45);
      padding-bottom: 3px;
    }

    .clock-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .clock-row strong {
      color: var(--accent-2);
      font-weight: 600;
    }

    .controls {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 6px;
      align-items: center;
    }

    .search,
    .btn,
    .toggle,
    .chip {
      font: 500 0.72rem/1.2 var(--font-body);
      letter-spacing: 0.04em;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      color: var(--text);
      background: rgba(10, 16, 10, 0.92);
      box-shadow: inset 1px 1px 0 rgba(154, 197, 140, 0.14), inset -1px -1px 0 rgba(4, 7, 4, 0.7);
    }

    .search::placeholder {
      color: #748673;
    }

    .btn,
    .toggle,
    .chip {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #c9dbc4;
      background: linear-gradient(180deg, #1b2b1b, #142314);
      cursor: pointer;
      box-shadow: inset 1px 1px 0 rgba(174, 220, 159, 0.17), inset -1px -1px 0 rgba(4, 8, 4, 0.75);
      white-space: nowrap;
    }

    .btn:hover,
    .toggle:hover,
    .chip:hover {
      border-color: var(--line-bright);
      color: var(--accent-2);
    }

    .mode {
      display: inline-flex;
      gap: 4px;
    }

    .toggle.active {
      border-color: #6a9163;
      color: #d6f0cd;
      background: linear-gradient(180deg, #264225, #1b331b);
    }

    .btn.warn {
      border-color: #7b6e4f;
      color: #e1cea7;
      background: linear-gradient(180deg, #312818, #241c12);
    }

    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip {
      padding: 5px 7px;
      font-size: 0.6rem;
    }

    .status {
      padding: 7px 9px;
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(10, 16, 10, 0.8);
      color: #a8b8a4;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status strong {
      color: var(--accent-2);
    }

    .status.error strong {
      color: #e4b3a6;
    }

    .board {
      padding: 10px;
      display: grid;
      gap: 9px;
      max-height: calc(100vh - 214px);
      overflow: auto;
      scrollbar-width: thin;
    }

    .overview {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .stat {
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(10, 16, 10, 0.85);
      box-shadow: inset 1px 1px 0 rgba(169, 212, 154, 0.13), inset -1px -1px 0 rgba(4, 8, 4, 0.72);
      min-height: 64px;
      display: grid;
      gap: 2px;
    }

    .stat .label {
      margin: 0;
      color: #8d9d8a;
      font-size: 0.53rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat .value {
      margin: 0;
      color: var(--accent-2);
      font: 500 1.22rem/1 var(--font-head);
      letter-spacing: 0.02em;
    }

    .stat .sub {
      margin: 0;
      color: #95a693;
      font-size: 0.58rem;
    }

    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: auto;
      background: rgba(9, 14, 9, 0.85);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }

    thead th {
      text-align: left;
      padding: 7px 8px;
      font-size: 0.54rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8d9f89;
      background: rgba(12, 19, 12, 0.84);
      border-bottom: 1px solid rgba(70, 95, 70, 0.48);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tbody td {
      padding: 7px 8px;
      border-top: 1px solid rgba(55, 77, 55, 0.45);
      font-size: 0.65rem;
      color: #c1d2bc;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: rgba(42, 63, 42, 0.25);
    }

    .item-cell {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      min-width: 220px;
    }

    .item-cell img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      border: 1px solid #294129;
      border-radius: 4px;
      background: rgba(9, 14, 9, 0.8);
    }

    .item-name {
      margin: 0;
      font-size: 0.68rem;
      color: #d6e6d1;
      line-height: 1.3;
    }

    .item-sub {
      margin: 1px 0 0;
      font-size: 0.54rem;
      color: #8ea08a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .wiki {
      color: #b3cfe4;
      text-decoration: none;
      border-bottom: 1px dotted rgba(179, 207, 228, 0.45);
      font-size: 0.57rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .wiki:hover {
      color: #d0e4f3;
      border-bottom-color: rgba(208, 228, 243, 0.75);
    }

    .empty {
      padding: 16px;
      border: 1px dashed rgba(77, 104, 77, 0.82);
      border-radius: 6px;
      background: rgba(10, 16, 10, 0.82);
      text-align: center;
      color: #94a492;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .price-up {
      color: #d9b18f;
    }

    .price-down {
      color: #98cf9b;
    }

    @media (max-width: 1120px) {
      .overview {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .search-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 8px;
      }

      .mast {
        grid-template-columns: 1fr;
      }

      .overview {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="crt-flicker" aria-hidden="true"></div>

  <div class="shell">
    <header class="frame mast">
      <div>
        <p class="kicker">Escape from Tarkov // 90s Mission Control</p>
        <h1 class="title">Flea Prices</h1>
        <nav class="top-nav" aria-label="Pages">
          <a class="nav-btn" href="./index.html">Quest Board</a>
          <a class="nav-btn" href="./flea.html" aria-current="page">Flea Prices</a>
        </nav>
      </div>
      <div class="clock-card bevel" aria-label="Clocks">
        <div class="clock-row"><span>IRL Time</span><strong id="clockIrl">--:--:--</strong></div>
        <div class="clock-row"><span>Tarkov Day</span><strong id="clockDay">--:--:--</strong></div>
        <div class="clock-row"><span>Tarkov Night</span><strong id="clockNight">--:--:--</strong></div>
      </div>
    </header>

    <section class="frame controls" aria-label="Flea controls">
      <form id="searchForm" class="search-row" autocomplete="off">
        <input id="searchInput" class="search" type="search" placeholder="Search item name (e.g., Graphics card, LEDX, M855A1)...">
        <div class="mode" role="group" aria-label="Game mode">
          <button id="modePvp" type="button" class="toggle active" data-mode="regular">PvP</button>
          <button id="modePve" type="button" class="toggle" data-mode="pve">PvE</button>
        </div>
        <button id="searchBtn" type="submit" class="btn">Search</button>
        <button id="clearBtn" type="button" class="btn warn">Clear</button>
      </form>
      <div class="chip-row">
        <span class="item-sub">Quick search:</span>
        <button class="chip" data-chip="Graphics card" type="button">Graphics card</button>
        <button class="chip" data-chip="LEDX" type="button">LEDX</button>
        <button class="chip" data-chip="Fuel conditioner" type="button">Fuel conditioner</button>
        <button class="chip" data-chip="Moonshine" type="button">Moonshine</button>
      </div>
      <div id="statusBox" class="status bevel">
        <span>Data status: <strong id="statusText">Idle</strong></span>
        <span>Mode: <strong id="modeLabel">PvP</strong></span>
      </div>
    </section>

    <main class="frame board">
      <section id="overview" class="overview"></section>
      <section id="results"></section>
    </main>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "eft_flea_state_v1";
      const ENDPOINT = "https://api.tarkov.dev/graphql";
      const ITEM_QUERY = `query ItemSearch($name: String!, $limit: Int!, $mode: GameMode) {
        items(name: $name, limit: $limit, gameMode: $mode) {
          id
          name
          shortName
          iconLink
          wikiLink
          avg24hPrice
          lastLowPrice
          low24hPrice
          high24hPrice
          updated
          sellFor { source price currency priceRUB }
          buyFor { source price currency priceRUB }
        }
      }`;

      const refs = {
        clockIrl: document.getElementById("clockIrl"),
        clockDay: document.getElementById("clockDay"),
        clockNight: document.getElementById("clockNight"),
        searchForm: document.getElementById("searchForm"),
        searchInput: document.getElementById("searchInput"),
        modePvp: document.getElementById("modePvp"),
        modePve: document.getElementById("modePve"),
        searchBtn: document.getElementById("searchBtn"),
        clearBtn: document.getElementById("clearBtn"),
        statusBox: document.getElementById("statusBox"),
        statusText: document.getElementById("statusText"),
        modeLabel: document.getElementById("modeLabel"),
        overview: document.getElementById("overview"),
        results: document.getElementById("results")
      };

      const state = {
        query: "",
        mode: "regular",
        items: [],
        loading: false,
        error: "",
        fetchedAt: null
      };

      function nowIso() {
        return new Date().toISOString();
      }

      function readStorage() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      function writeStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            query: state.query,
            mode: state.mode
          }));
        } catch {
          // ignore storage failures
        }
      }

      function formatRub(value) {
        if (!Number.isFinite(value) || value <= 0) return "--";
        return `${Math.round(value).toLocaleString()} ₽`;
      }

      function formatStamp(value) {
        if (!value) return "--";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "--";
        return date.toLocaleString([], {
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function bestTraderOffer(item) {
        const offers = Array.isArray(item?.sellFor) ? item.sellFor : [];
        const usable = offers
          .map((offer) => ({
            source: String(offer?.source || "Trader"),
            priceRUB: Number(offer?.priceRUB || 0)
          }))
          .filter((offer) => Number.isFinite(offer.priceRUB) && offer.priceRUB > 0)
          .sort((a, b) => b.priceRUB - a.priceRUB);

        return usable[0] || null;
      }

      function modeText() {
        return state.mode === "pve" ? "PvE" : "PvP";
      }

      function setMode(mode) {
        state.mode = mode;
        refs.modePvp.classList.toggle("active", mode === "regular");
        refs.modePve.classList.toggle("active", mode === "pve");
        refs.modeLabel.textContent = modeText();
        writeStorage();
      }

      function setStatus(text, isError = false) {
        refs.statusText.textContent = text;
        refs.statusBox.classList.toggle("error", isError);
      }

      function renderOverview() {
        const total = state.items.length;
        const withFleaPrice = state.items.filter((item) => Number.isFinite(Number(item.lastLowPrice)) && Number(item.lastLowPrice) > 0).length;
        const priced = state.items
          .map((item) => Number(item.lastLowPrice || 0))
          .filter((value) => Number.isFinite(value) && value > 0)
          .sort((a, b) => b - a);
        const top = priced[0] || 0;

        const cards = [
          { label: "Matches", value: String(total), sub: state.query ? `for ${state.query}` : "no query" },
          { label: "Mode", value: modeText(), sub: "live lookup" },
          { label: "Flea Data", value: `${withFleaPrice}/${total || 0}`, sub: "with last low" },
          { label: "Top Last Low", value: formatRub(top), sub: state.fetchedAt ? formatStamp(state.fetchedAt) : "--" }
        ];

        refs.overview.innerHTML = cards
          .map((card) => `
            <article class="stat">
              <p class="label">${escapeHtml(card.label)}</p>
              <p class="value">${escapeHtml(card.value)}</p>
              <p class="sub">${escapeHtml(card.sub)}</p>
            </article>
          `)
          .join("");
      }

      function renderResults() {
        if (state.loading) {
          refs.results.innerHTML = '<div class="empty">Querying flea market feed...</div>';
          return;
        }

        if (!state.query) {
          refs.results.innerHTML = '<div class="empty">Search for an item to load flea prices.</div>';
          return;
        }

        if (state.error) {
          refs.results.innerHTML = `<div class="empty">${escapeHtml(state.error)}</div>`;
          return;
        }

        if (!state.items.length) {
          refs.results.innerHTML = '<div class="empty">No matching items found.</div>';
          return;
        }

        const rows = state.items.map((item) => {
          const lastLow = Number(item.lastLowPrice || 0);
          const avg24h = Number(item.avg24hPrice || 0);
          const low24h = Number(item.low24hPrice || 0);
          const high24h = Number(item.high24hPrice || 0);
          const offer = bestTraderOffer(item);
          const delta = Number.isFinite(lastLow) && Number.isFinite(avg24h) && avg24h > 0 ? lastLow - avg24h : 0;
          const deltaClass = delta > 0 ? "price-up" : "price-down";
          const deltaText = Number.isFinite(delta) && avg24h > 0 ? `${delta > 0 ? "+" : ""}${Math.round(delta).toLocaleString()} ₽` : "--";

          return `
            <tr>
              <td>
                <div class="item-cell">
                  <img src="${escapeHtml(item.iconLink || "")}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                  <div>
                    <p class="item-name">${escapeHtml(item.name || "Unknown item")}</p>
                    <p class="item-sub">${escapeHtml(item.shortName || "")}</p>
                  </div>
                </div>
              </td>
              <td>${formatRub(lastLow)}</td>
              <td>${formatRub(avg24h)}</td>
              <td>${formatRub(low24h)} - ${formatRub(high24h)}</td>
              <td class="${deltaClass}">${escapeHtml(deltaText)}</td>
              <td>${offer ? `${escapeHtml(offer.source)} // ${formatRub(offer.priceRUB)}` : "--"}</td>
              <td>${item.wikiLink ? `<a class="wiki" href="${escapeHtml(item.wikiLink)}" target="_blank" rel="noopener noreferrer">Wiki</a>` : "--"}</td>
              <td>${escapeHtml(formatStamp(item.updated))}</td>
            </tr>
          `;
        }).join("");

        refs.results.innerHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Last Low</th>
                  <th>24h Avg</th>
                  <th>24h Range</th>
                  <th>Delta vs Avg</th>
                  <th>Best Trader Sell-To</th>
                  <th>Wiki</th>
                  <th>Updated</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      async function searchItems() {
        const query = state.query.trim();
        if (query.length < 2) {
          state.items = [];
          state.error = "Type at least 2 characters to search.";
          setStatus("Need longer query", true);
          renderOverview();
          renderResults();
          return;
        }

        state.loading = true;
        state.error = "";
        setStatus("Syncing live flea feed", false);
        renderResults();

        try {
          const response = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              query: ITEM_QUERY,
              variables: {
                name: query,
                limit: 40,
                mode: state.mode
              }
            })
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const payload = await response.json();
          if (payload?.errors?.length) {
            throw new Error(payload.errors[0]?.message || "GraphQL error");
          }

          state.items = Array.isArray(payload?.data?.items) ? payload.data.items : [];
          state.fetchedAt = nowIso();
          setStatus(`Loaded ${state.items.length} item${state.items.length === 1 ? "" : "s"}`, false);
        } catch {
          state.items = [];
          state.error = "Live flea pricing unavailable right now. Try again in a moment.";
          setStatus("Live lookup failed", true);
        } finally {
          state.loading = false;
          renderOverview();
          renderResults();
        }
      }

      function formatHHMMSS(date) {
        return [date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds()]
          .map((value) => String(value).padStart(2, "0"))
          .join(":");
      }

      function getTarkovTime(now, dayCycle) {
        const dayMs = 24 * 60 * 60 * 1000;
        const offset = (3 * 60 * 60 * 1000) + (dayCycle ? 0 : 12 * 60 * 60 * 1000);
        return new Date((offset + 7 * now.getTime()) % dayMs);
      }

      function tickClocks() {
        const now = new Date();
        refs.clockIrl.textContent = now.toLocaleTimeString([], {
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
        refs.clockDay.textContent = formatHHMMSS(getTarkovTime(now, true));
        refs.clockNight.textContent = formatHHMMSS(getTarkovTime(now, false));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function bindEvents() {
        refs.searchForm.addEventListener("submit", (event) => {
          event.preventDefault();
          state.query = refs.searchInput.value.trim();
          writeStorage();
          searchItems();
        });

        refs.modePvp.addEventListener("click", () => {
          setMode("regular");
          if (state.query.length >= 2) searchItems();
        });

        refs.modePve.addEventListener("click", () => {
          setMode("pve");
          if (state.query.length >= 2) searchItems();
        });

        refs.clearBtn.addEventListener("click", () => {
          state.query = "";
          state.items = [];
          state.error = "";
          state.fetchedAt = null;
          refs.searchInput.value = "";
          writeStorage();
          setStatus("Idle", false);
          renderOverview();
          renderResults();
        });

        document.querySelectorAll("[data-chip]").forEach((button) => {
          button.addEventListener("click", () => {
            const value = button.dataset.chip || "";
            state.query = value;
            refs.searchInput.value = value;
            writeStorage();
            searchItems();
          });
        });
      }

      function hydrate() {
        const saved = readStorage();
        if (!saved) return;

        state.query = String(saved.query || "");
        state.mode = saved.mode === "pve" ? "pve" : "regular";
      }

      function init() {
        hydrate();
        setMode(state.mode);
        refs.searchInput.value = state.query;

        bindEvents();
        tickClocks();
        setInterval(tickClocks, 1000);

        setStatus("Idle", false);
        renderOverview();
        renderResults();

        if (state.query.length >= 2) {
          searchItems();
        }
      }

      init();
    })();
  </script>
</body>
</html>
