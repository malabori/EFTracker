<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flea Market Prices — EFTracking</title>
    <meta
      name="description"
      content="Look up Escape from Tarkov flea market prices for PvP and PvE: lowest listing, 24-hour average, best trader offer and value per slot."
    />
    <meta name="theme-color" content="#0a0b0d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121417'/%3E%3Cpath d='M11 8v16M11 17l9-9M14.5 14 21 24' fill='none' stroke='%23cdb787' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./src/styles/theme.css" />
    <link rel="stylesheet" href="./src/styles/flea.css" />
    <script type="module" src="./src/flea/main.js"></script>
  </head>
  <body>
    <div id="backdrop"></div>
    <a class="skip-link" href="#results">Skip to results</a>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html" aria-label="EFTracking home">
          <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#16191d" stroke="#363c44" />
            <path
              d="M11 8v16M11 17l9-9M14.5 14 21 24"
              fill="none"
              stroke="#cdb787"
              stroke-width="2.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          EFTRACKING
        </a>
        <nav class="site-nav" aria-label="Pages">
          <a href="./index.html">Quests</a>
          <a href="./flea.html" aria-current="page">Flea market</a>
        </nav>
        <div class="raid-clocks" role="group" aria-label="Current in-raid times">
          <span class="clock-label">Raid time</span>
          <span
            class="clock"
            data-raid-clock="left"
            title="Left time option in the raid menu"
          >
            <span class="phase-icon" aria-hidden="true"></span>
            <span data-time>--:--</span>
            <span class="sr-only" data-phase-label></span>
          </span>
          <span
            class="clock"
            data-raid-clock="right"
            title="Right time option in the raid menu"
          >
            <span class="phase-icon" aria-hidden="true"></span>
            <span data-time>--:--</span>
            <span class="sr-only" data-phase-label></span>
          </span>
        </div>
      </div>
    </header>

    <div class="page">
      <section class="lookup card" aria-labelledby="lookup-title">
        <div class="lookup-head">
          <h1 id="lookup-title" class="lookup-title">Flea market prices</h1>
          <div class="segmented" role="group" aria-label="Game mode" data-setting="mode">
            <button type="button" data-value="regular" aria-pressed="true">PvP</button>
            <button type="button" data-value="pve" aria-pressed="false">PvE</button>
          </div>
        </div>
        <form class="search-box" id="search-form" role="search" autocomplete="off">
          <svg
            class="search-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="7"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="m20 20-3.5-3.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <input
            id="search"
            type="search"
            enterkeyhint="search"
            placeholder="Item name — Graphics card, LEDX, M855A1…"
            aria-label="Item name"
          />
          <kbd aria-hidden="true">/</kbd>
        </form>
        <div class="lookup-row">
          <div class="chips" id="quick-chips" role="group" aria-label="Quick searches">
            <button type="button" class="chip" data-query="Graphics card">
              Graphics card
            </button>
            <button type="button" class="chip" data-query="LEDX">LEDX</button>
            <button type="button" class="chip" data-query="Fuel conditioner">
              Fuel conditioner
            </button>
            <button type="button" class="chip" data-query="Moonshine">Moonshine</button>
          </div>
          <label class="sort-field">
            <span class="field-label">Sort</span>
            <select id="sort">
              <option value="relevance">Best match</option>
              <option value="flea">Flea price</option>
              <option value="avg">24h average</option>
              <option value="trader">Best trader offer</option>
              <option value="slot">Value per slot</option>
            </select>
          </label>
        </div>
        <div class="data-status" id="data-status" data-tone="ok">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="data-status-text" role="status"></span>
          <button type="button" class="text-btn" id="retry-btn" hidden>Retry</button>
        </div>
      </section>

      <main class="results card" id="results" tabindex="-1" aria-label="Prices"></main>
    </div>

    <footer class="site-footer">
      <div class="footer-tools">
        <button type="button" class="btn btn-quiet" id="backdrop-toggle">
          Background: Animated
        </button>
      </div>
      <p class="fineprint">
        Price data comes from
        <a href="https://tarkov.dev" target="_blank" rel="noopener">tarkov.dev</a>, a
        community project, and can lag the in-game market by a few minutes. EFTracking is
        a fan site and is not affiliated with Battlestate Games.
      </p>
    </footer>
    <noscript
      ><p class="noscript">EFTracking needs JavaScript to look up prices.</p></noscript
    >
  </body>
</html>
